    - data:
        code: |

          import json
          import re
          from datetime import date, datetime


          def _date(value, today):
              if not value:
                  return None
              s = str(value).strip()
              if s in ("今天", "今日"):
                  return today
              if s in ("明天", "明日"):
                  return today + __import__("datetime").timedelta(days=1)
              m = re.fullmatch(r"(\d{4})-(\d{1,2})-(\d{1,2})", s)
              if m:
                  try:
                      return date(int(m[1]), int(m[2]), int(m[3]))
                  except Exception:
                      return None
              return None


          def _time(value):
              if not value:
                  return None
              s = str(value).strip().replace("：", ":")
              m = re.fullmatch(r"(\d{1,2}):(\d{2})", s)
              if not m:
                  return None
              return "%02d:%02d" % (int(m[1]), int(m[2]))


          def _minutes(t):
              h, m = [int(x) for x in t.split(":")]
              return h * 60 + m


          def _hhmm(v):
              v = v % (24 * 60)
              return "%02d:%02d" % (v // 60, v % 60)


          def main(extracted_json: str, now_iso: str, existing: str) -> dict:
              raw = str(extracted_json or "")
              text = re.sub(r"<think.*?</think>", "", raw, flags=re.S)
              a, b = text.find("{"), text.rfind("}")
              data = {}
              if a >= 0 and b > a:
                  try:
                      data = json.loads(text[a:b + 1])
                  except Exception:
                      data = {}

              items = data.get("items")
              if not isinstance(items, list) or not items:
                  items = [data] if data.get("title") else []

              today = date.today()
              if now_iso:
                  try:
                      today = datetime.fromisoformat(now_iso).date()
                  except Exception:
                      pass

              try:
                  rows = json.loads(existing or "[]")
                  if isinstance(rows, dict):
                      rows = rows.get("data") or []
              except Exception:
                  rows = []
              if not isinstance(rows, list):
                  rows = []

              events = []
              tasks = []
              conflicts = []
              lines_out = []
              missing = []

              for item in items:
                  title = str(item.get("title") or "").strip()
                  if not title:
                      missing.append(item)
                      continue

                  day = _date(item.get("date"), today)
                  start = _time(item.get("start_time"))
                  end = _time(item.get("end_time"))
                  kind = str(item.get("kind") or ("event" if start else "task"))
                  location = str(item.get("location") or "").strip()
                  category = str(item.get("category") or "其他").strip() or "其他"

                  if kind == "event" and start and day:
                      if not end:
                          end = _hhmm(_minutes(start) + 60)
                      key = day.isoformat()
                      new_row = {
                          "user_id": "demo",
                          "title": title,
                          "event_date": key,
                          "start_time": start,
                          "end_time": end,
                          "location": location,
                          "category": category,
                          "note": "来自智能体",
                          "source": "agent",
                          "status": "planned",
                      }
                      ns, ne = _minutes(start), _minutes(end)
                      hits = []
                      for row in rows:
                          if str(row.get("event_date") or "")[:10] != key:
                              continue
                          s2 = _minutes(str(row.get("start_time") or "00:00")[:5])
                          e2 = _minutes(str(row.get("end_time") or "00:00")[:5])
                          if ns < e2 and s2 < ne:
                              hits.append(str(row.get("title") or "未命名"))
                      for row in events:
                          if row["event_date"] != key:
                              continue
                          s2 = _minutes(row["start_time"])
                          e2 = _minutes(row["end_time"])
                          if ns < e2 and s2 < ne:
                              hits.append(row["title"])
                      if hits:
                          conflicts.append("%s 与 %s 冲突" % (title, "、".join(hits)))
                      events.append(new_row)
                      lines_out.append("%s｜%s %s-%s｜%s%s" % (
                          title, key, start, end, location or "地点待定",
                          "（与 %s 冲突）" % "、".join(hits) if hits else ""))
                  else:
                      tasks.append({
                          "user_id": "demo",
                          "title": title,
                          "done": False,
                          "task_date": (day.isoformat() if day else today.isoformat()),
                      })
                      lines_out.append("%s｜%s｜已放任务栏" % (
                          title, day.isoformat() if day else today.isoformat()))

              ok = len(missing) == 0 and bool(items)
              if not items:
                  ask_text = "没识别出具体安排。可以直接说“明天下午三点开会”，或者贴一段通知。"
              elif missing:
                  ask_text = "有 %d 条没识别出标题，麻烦补一下（比如带引号写标题）。" % len(missing)
              else:
                  ask_text = ""

              draft = missing[0] if missing else {}
              summary = "\n".join(lines_out)
              conflict_text = "；".join(conflicts) if conflicts else "无冲突"

              return {
                  "ok": ok,
                  "ask_text": ask_text,
                  "summary": summary,
                  "conflict_text": conflict_text,
                  "events_json": json.dumps(events, ensure_ascii=False),
                  "tasks_json": json.dumps(tasks, ensure_ascii=False),
                  "draft_json": json.dumps(draft, ensure_ascii=False),
                  "event_count": len(events),
                  "task_count": len(tasks),
              }

        code_language: python3
        outputs:
          ask_text:
            children: null
