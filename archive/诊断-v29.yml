    - data:
        code: |

          import json
          import re

          CONFIRM = ("确认", "确定")


          def _line(item):
              return "%s %s %s-%s" % (
                  item.get("event_date", ""),
                  item.get("title", ""),
                  str(item.get("start_time") or "")[:5],
                  str(item.get("end_time") or "")[:5],
              )


          def _tokens(text):
              dates = set()
              for m in re.finditer(r"(20\d{2})-(\d{1,2})-(\d{1,2})", text):
                  dates.add("%04d-%02d-%02d" % (int(m[1]), int(m[2]), int(m[3])))
              for m in re.finditer(r"(?<![\d.])(\d{1,2})[.\-/](\d{1,2})(?![\d])", text):
                  dates.add("%02d-%02d" % (int(m[1]), int(m[2])))
              times = set()
              for m in re.finditer(r"(?<!\d)(\d{1,2})[:：](\d{2})(?!\d)", text):
                  times.add("%02d:%02d" % (int(m[1]), int(m[2])))
              return dates, times


          def _keep(item, dates, times, sd, se):
              day = str(item.get("event_date") or "")[:10]
              if sd and day and day < sd:
                  return False
              if se and day and day > se:
                  return False
              if dates and not any(day == d or day.endswith(d) for d in dates):
                  return False
              if times:
                  st = str(item.get("start_time") or "")[:5]
                  if st not in times:
                      return False
              return True


          def main(body: str, target: str, pending: str, query: str, stage: str,
                   candidates: str, start_date: str, end_date: str, pending_filter: str) -> dict:
              try:
                  rows = json.loads(body or "[]")
                  if isinstance(rows, dict):
                      rows = rows.get("data") or []
              except Exception:
                  rows = []
              if not isinstance(rows, list):
                  rows = []

              text = str(query or "")
              pending_id = str(pending or "").strip()
              stage = str(stage or "").strip()
              sd = str(start_date or "")[:10]
              se = str(end_date or "")[:10]
              if sd and se and sd > se:
                  sd, se = se, sd

              if pending_id and (any(w in text for w in CONFIRM) or text.strip() in ("删", "删除", "删掉")):
                  return {"mode": "execute", "id": pending_id, "id_filter": (str(pending_filter or "").strip() or ("eq." + pending_id)),
                          "count": 1, "dup_count": 1,
                          "text": "正在删除…", "title": "", "item_json": "",
                          "next_stage": "", "candidates_json": ""}

              try:
                  cands = json.loads(candidates or "[]")
              except Exception:
                  cands = []
              if not isinstance(cands, list):
                  cands = []

              dates, times = _tokens(text)
              key = str(target or "").strip()

              pool = rows
              if key:
                  pool = [r for r in rows if key in str(r.get("title") or "")]
              narrowed = [r for r in pool if _keep(r, dates, times, sd, se)]

              if not narrowed and stage == "clarify" and cands:
                  pool2 = cands
                  if key:
                      pool2 = [r for r in cands if key in str(r.get("title") or "")]
                  narrowed = [r for r in pool2 if _keep(r, dates, times, sd, se)]

              if not narrowed:
                  return {"mode": "none", "id": "", "id_filter": "", "count": 0, "dup_count": 0,
                          "text": "没找到匹配的日程。可以说得再具体一点，比如“11月3日 15:00 和导师开会”。",
                          "title": "", "item_json": "", "next_stage": "", "candidates_json": ""}

              groups = {}
              order = []
              for item in narrowed:
                  k = (str(item.get("title") or ""), str(item.get("event_date") or "")[:10],
                       str(item.get("start_time") or "")[:5], str(item.get("end_time") or "")[:5])
                  if k not in groups:
                      groups[k] = []
                      order.append(k)
                  groups[k].append(item)

              if len(order) == 1:
                  group = groups[order[0]]
                  ids = [str(x.get("id") or "") for x in group if x.get("id")]
                  item = group[0]
                  extra = "" if len(ids) <= 1 else "\n注意：这条有 %d 条完全相同的记录，会一起删掉。" % len(ids)
                  return {"mode": "confirm", "id": ids[0] if ids else "",
                          "id_filter": "in.(%s)" % ",".join(ids),
                          "count": len(ids), "dup_count": len(ids),
                          "text": "找到 1 条：\n" + _line(item) + extra + "\n\n要删的话回“确认”。",
                          "title": item.get("title", ""),
                          "item_json": json.dumps(item, ensure_ascii=False),
                          "next_stage": "confirm",
                          "candidates_json": json.dumps(narrowed[:5], ensure_ascii=False)}

              rendered = [_line(groups[k][0]) for k in order[:5]]
              return {"mode": "multiple", "id": "", "id_filter": "", "count": len(order), "dup_count": 0,
                      "text": "找到 %d 条：\n%s\n\n说清楚删哪条，比如“11月3日 15:00 的那条”。" % (len(order), "\n".join(rendered)),
                      "title": "", "item_json": "",
                      "next_stage": "clarify",
                      "candidates_json": json.dumps([groups[k][0] for k in order[:5]], ensure_ascii=False)}

