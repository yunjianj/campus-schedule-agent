    - data:
        code: |

          import json


          def _m(value):
              parts = str(value or "00:00").split(":")
              return int(parts[0]) * 60 + int(parts[1] if len(parts) > 1 else 0)


          def _hhmm(total):
              total = total % (24 * 60)
              return "%02d:%02d" % (total // 60, total % 60)


          def main(item_json: str, new_date: str, new_start: str, new_end: str) -> dict:
              try:
                  item = json.loads(item_json or "{}")
              except Exception:
                  item = {}

              patch = {}
              date_value = str(new_date or "").strip()
              if date_value:
                  patch["event_date"] = date_value[:10]

              start = str(new_start or "").strip()
              end = str(new_end or "").strip()
              if start:
                  patch["start_time"] = start
                  if end:
                      patch["end_time"] = end
                  else:
                      duration = _m(item.get("end_time")) - _m(item.get("start_time"))
                      if duration <= 0:
                          duration = 60
                      patch["end_time"] = _hhmm(_m(start) + duration)
              elif end:
                  patch["end_time"] = end

              return {"patch_json": json.dumps(patch, ensure_ascii=False)}

        code_language: python3
        outputs:
          patch_json:
            children: null
            type: string
