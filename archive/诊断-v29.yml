    - data:
        code: |

          import json


          def _hm(value):
              parts = str(value or "00:00").split(":")
              return int(parts[0]) * 60 + int(parts[1] if len(parts) > 1 else 0)


          def main(body: str, now_iso: str) -> dict:
              try:
                  rows = json.loads(body or "[]")
                  if isinstance(rows, dict):
                      rows = rows.get("data") or []
              except Exception:
                  rows = []
              if not isinstance(rows, list):
                  rows = []

              days = {}
              for item in rows:
                  key = str(item.get("event_date") or "")[:10]
                  if not key:
                      continue
                  bucket = days.setdefault(key, {"n": 0, "min": 0, "first": "99:99", "last": "00:00"})
                  bucket["n"] += 1
                  start = _hm(item.get("start_time"))
                  finish = _hm(item.get("end_time"))
                  bucket["min"] += max(0, finish - start)
                  if start < _hm(bucket["first"]):
                      bucket["first"] = str(item.get("start_time"))[:5]
                  if finish > _hm(bucket["last"]):
                      bucket["last"] = str(item.get("end_time"))[:5]

              lines = []
              for key in sorted(days):
                  bucket = days[key]
                  lines.append("%s  %d 条  %.1f 小时  最早 %s  最晚 %s" % (
                      key, bucket["n"], bucket["min"] / 60.0, bucket["first"], bucket["last"]))
              if not lines:
                  lines.append("（过去两周和未来两周都没有安排）")

              return {"text": "过去/未来各 7 天概览：\n" + "\n".join(lines)}

