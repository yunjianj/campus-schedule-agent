    - data:
        code: |

          import json
          from datetime import date, timedelta


          def _minutes(value):
              parts = str(value or "00:00").split(":")
              return int(parts[0]) * 60 + int(parts[1] if len(parts) > 1 else 0)


          def _week_label(day_text):
              try:
                  d = date.fromisoformat(str(day_text)[:10])
              except Exception:
                  return ""
              start = d - timedelta(days=d.weekday())
              return "%s~%s" % (start.strftime("%m-%d"), (start + timedelta(days=6)).strftime("%m-%d"))


          def main(body: str, reviews_body: str, period: str, start_date: str, end_date: str) -> dict:
              try:
                  rows = json.loads(body or "[]")
                  if isinstance(rows, dict):
                      rows = rows.get("data") or []
              except Exception:
                  rows = []
              if not isinstance(rows, list):
                  rows = []

              total = len(rows)
              done_manual = 0
              done_auto = 0
              undone = 0
              cat_minutes = {}
              cat_count = {}
              day_rows = {}
              week_rows = {}

              for item in rows:
                  status = str(item.get("status") or "planned")
                  manual = item.get("manual_override") is True
                  if status == "done" and manual:
                      done_manual += 1
                  elif status == "done":
                      done_auto += 1
                  else:
                      undone += 1

                  cat = str(item.get("category") or "其他")
                  minutes = max(0, _minutes(item.get("end_time")) - _minutes(item.get("start_time")))
                  cat_minutes[cat] = cat_minutes.get(cat, 0) + minutes
                  cat_count[cat] = cat_count.get(cat, 0) + 1

                  day = str(item.get("event_date") or "")[:10]
                  day_rows.setdefault(day, []).append(item)

                  label = _week_label(day)
                  if label:
                      bucket = week_rows.setdefault(label, {"total": 0, "done": 0})
                      bucket["total"] += 1
                      if status == "done":
                          bucket["done"] += 1

              cat_lines = []
              for cat in sorted(cat_minutes, key=lambda k: -cat_minutes[k]):
                  cat_lines.append("%s %.1f 小时（%d 条）" % (cat, cat_minutes[cat] / 60.0, cat_count[cat]))

              items = []
              for day in sorted(day_rows):
                  for item in sorted(day_rows[day], key=lambda x: str(x.get("start_time") or "")):
                      status = "已完成" if str(item.get("status")) == "done" else "未完成"
                      if str(item.get("status")) == "done" and item.get("manual_override") is not True:
                          status = "按时间默认完成"
                      items.append("%s %s %s-%s %s（%s）" % (
                          day, item.get("title", ""),
                          str(item.get("start_time") or "")[:5], str(item.get("end_time") or "")[:5],
                          item.get("location", ""), status))

              rate = int(round((done_manual + done_auto) * 100.0 / total)) if total else 0
              summary = "%s 至 %s，共 %d 条安排：手动确认完成 %d 条，按时间默认完成 %d 条，未完成 %d 条（完成率 %d%%）。" % (
                  start_date, end_date, total, done_manual, done_auto, undone, rate)
              if cat_lines:
                  summary += "\n时间去向：" + "；".join(cat_lines[:5])

              week_lines = []
              for label in sorted(week_rows):
                  bucket = week_rows[label]
                  week_rate = int(round(bucket["done"] * 100.0 / bucket["total"])) if bucket["total"] else 0
                  week_lines.append("%s：%d 条，完成 %d 条（%d%%）" % (label, bucket["total"], bucket["done"], week_rate))
              if period == "month" and week_lines:
                  summary += "\n按周：" + "；".join(week_lines)
              if not rows:
                  summary = "%s 至 %s 没有安排。" % (start_date, end_date)

              history_lines = []
              try:
                  reviews = json.loads(reviews_body or "[]")
                  if isinstance(reviews, dict):
                      reviews = reviews.get("data") or []
              except Exception:
                  reviews = []
              if isinstance(reviews, list):
                  for review in reviews[:3]:
                      text = str(review.get("report") or "").replace("\n", " ")
                      history_lines.append("[%s] %s" % (str(review.get("range_start") or "")[:10], text[:160]))

              if period == "day":
                  ask_text = summary + "\n\n今天哪些没按计划完成？明天想怎么调整？"
              elif period == "month":
                  ask_text = summary + "\n\n按周看，哪几周完成得好、哪几周掉队了？这个月最大的问题是什么？下个月想改进什么？"
              else:
                  ask_text = summary + "\n\n告诉我三件事：\n1. 哪几条没完成、原因是什么\n2. 本周最有成就感的一件事（学业/项目/班级/技能）\n3. 遇到的问题，或想沉淀下来的经验"

              return {
                  "summary": summary,
                  "items": "\n".join(items) if items else "（没有日程）",
                  "history": "\n".join(history_lines) if history_lines else "（没有历史复盘）",
                  "ask_text": ask_text,
                  "stats_json": json.dumps({
                      "total": total,
                      "done_manual": done_manual,
                      "done_auto": done_auto,
                      "undone": undone,
                      "rate": rate,
                      "categories": cat_minutes,
                      "weeks": week_rows,
                  }, ensure_ascii=False),
              }

        code_language: python3
        outputs:
          ask_text:
            children: null
            type: string
          history:
            children: null
            type: string
          items:
            children: null
            type: string
          stats_json:
            children: null
            type: string
          summary:
            children: null
            type: string
