          import json

          CONFIRM_WORDS = ("确认", "确定")


          def main(body: str, target: str, pending: str, query: str) -> dict:
              try:
                  rows = json.loads(body or "[]")
                  if isinstance(rows, dict):
                      rows = rows.get("data") or []
              except Exception:
                  rows = []
              if not isinstance(rows, list):
                  rows = []

              text = str(query or "")
              pending_id = str(pending or "").strip()
              if pending_id and (any(w in text for w in CONFIRM_WORDS) or text.strip() in ("删", "删除", "删掉")):
                  return {"mode": "execute", "id": pending_id, "count": 1,
                          "text": "正在删除…", "title": "", "item_json": ""}

              key = str(target or "").strip()
              matches = []
              for item in rows:
                  title = str(item.get("title") or "")
                  if key and key not in title:
                      continue
                  matches.append(item)

              if not matches:
                  return {"mode": "none", "id": "", "count": 0,
                          "text": "没找到匹配的日程。可以说得再具体一点，比如带上日期或标题。",
                          "title": "", "item_json": ""}

              lines = []
              for item in matches[:5]:
                  lines.append("%s %s %s-%s" % (
                      item.get("event_date", ""),
                      item.get("title", ""),
                      str(item.get("start_time") or "")[:5],
                      str(item.get("end_time") or "")[:5],
                  ))

              if len(matches) == 1:
                  item = matches[0]
                  return {"mode": "confirm", "id": item.get("id", ""), "count": 1,
                          "text": "找到 1 条：\n" + lines[0] + "\n\n要删的话回“确认”。",
                          "title": item.get("title", ""),
                          "item_json": json.dumps(item, ensure_ascii=False)}

              return {"mode": "multiple", "id": "", "count": len(matches),
                      "text": "找到 %d 条：\n%s\n\n说清楚删哪条，比如加上日期。" % (len(matches), "\n".join(lines)),
                      "title": "", "item_json": ""}

