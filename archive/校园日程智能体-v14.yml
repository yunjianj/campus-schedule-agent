version: 0.7.0
workflow:
  conversation_variables:
  - description: 正在补全的日程（数据库行 JSON）
    id: var-draft
    name: draft
    selector:
    - conversation
    - draft
    value: ''
    value_type: string
  - description: 等待用户确认的日程（数据库行 JSON）
    id: var-pending
    name: pending_event
    selector:
    - conversation
    - pending_event
    value: ''
    value_type: string
  - description: 复盘上下文（日期范围）
    id: var-review
    name: review_range
    selector:
    - conversation
    - review_range
    value: ''
    value_type: string
  - description: 待删除日程 ID
    id: var-pending-delete
    name: pending_delete
    selector:
    - conversation
    - pending_delete
    value: ''
    value_type: string
  - description: 本次保存的冲突提示（空表示无冲突）
    id: var-conflict-note
    name: conflict_note
    selector:
    - conversation
    - conflict_note
    value: ''
    value_type: string
  - description: 复盘阶段（空 / collect）
    id: var-review-stage
    name: review_stage
    selector:
    - conversation
    - review_stage
    value: ''
    value_type: string
  - description: 规划状态（空 / awaiting）
    id: var-plan-stage
    name: plan_stage
    selector:
    - conversation
    - plan_stage
    value: ''
    value_type: string
  - description: 待写入的规划（blocks + tasks）
    id: var-pending-plan
    name: pending_plan
    selector:
    - conversation
    - pending_plan
    value: ''
    value_type: string
  environment_variables:
  - description: 网站接口根地址，导入后必须改
    id: env-base
    name: BASE_URL
    selector:
    - env
    - BASE_URL
    value: https://cfqneqilfjsxwbzmtjan.supabase.co/rest/v1
    value_type: string
  - description: 用户标识，单用户演示固定 demo
    id: env-user
    name: USER_ID
    selector:
    - env
    - USER_ID
    value: demo
    value_type: string
  - description: ''
    id: 55993cdd-6ea4-4062-bd1b-380958cc98e3
    name: SUPABASE_KEY
