    - data:
        code: |

          import json
          from datetime import date, datetime, timedelta

          WINDOW_START = 8 * 60
          WINDOW_END = 22 * 60
          MAX_BLOCK = 120
          MIN_BLOCK = 60
          MAX_PER_DAY = 2


          def _m(value):
              parts = str(value or "00:00").split(":")
              return int(parts[0]) * 60 + int(parts[1] if len(parts) > 1 else 0)


          def _hhmm(minutes):
              return "%02d:%02d" % (minutes // 60, minutes % 60)


          def _busy_by_day(rows):
              busy = {}
              for item in rows:
                  day = str(item.get("event_date") or "")[:10]
                  if not day:
                      continue
                  busy.setdefault(day, []).append((_m(item.get("start_time")), _m(item.get("end_time"))))
              for day in busy:
                  busy[day].sort()
              return busy


          def main(goals_json: str, body: str, now_iso: str) -> dict:
              try:
                  payload = json.loads(goals_json or "{}")
              except Exception:
                  payload = {}
              goals = payload.get("goals") or []
              constraints = str(payload.get("constraints") or "")

              try:
                  rows = json.loads(body or "[]")
                  if isinstance(rows, dict):
                      rows = rows.get("data") or []
              except Exception:
                  rows = []
              if not isinstance(rows, list):
                  rows = []
              busy = _busy_by_day(rows)

              today = date.today()
              if now_iso:
                  try:
                      today = datetime.fromisoformat(now_iso).date()
                  except Exception:
                      pass

              def sort_key(goal):
                  deadline = str(goal.get("deadline") or "")[:10]
                  prio = str(goal.get("priority") or "中")
                  prio_rank = {"高": 0, "中": 1, "低": 2}.get(prio, 1)
                  return (deadline or "9999-12-31", prio_rank)

              goals = sorted(goals, key=sort_key)

              blocks = []
              tasks = []
              lines_text = []
              used_per_day = {}

              for goal in goals:
                  title = str(goal.get("title") or "").strip()
                  if not title:
                      continue
                  remaining = int(goal.get("duration_min") or 60)
                  if remaining <= 0:
                      remaining = 60
                  deadline = str(goal.get("deadline") or "")[:10]
                  last_day = today + timedelta(days=7)
                  if deadline:
                      try:
                          last_day = min(last_day, date.fromisoformat(deadline))
                      except Exception:
                          pass

                  first_day = None
                  day = today
                  while day <= last_day and remaining > 0:
                      key = day.isoformat()
                      if used_per_day.get(key, 0) >= MAX_PER_DAY:
                          day += timedelta(days=1)
                          continue

                      windows = []
                      cursor = WINDOW_START
                      for start, end in sorted(busy.get(key, [])):
                          if start - cursor >= MIN_BLOCK:
                              windows.append((cursor, start))
                          cursor = max(cursor, end)
                      if WINDOW_END - cursor >= MIN_BLOCK:
                          windows.append((cursor, WINDOW_END))

                      for start, end in windows:
                          if remaining <= 0 or used_per_day.get(key, 0) >= MAX_PER_DAY:
                              break
                          span = end - start
                          if span < MIN_BLOCK:
                              continue
                          take = min(MAX_BLOCK, span, remaining)
                          if take < MIN_BLOCK:
                              continue
                          blocks.append({
                              "user_id": "demo",
                              "title": title,
                              "event_date": key,
                              "start_time": _hhmm(start),
                              "end_time": _hhmm(start + take),
                              "location": "",
                              "category": "个人事项",
                              "note": "来自智能体规划",
                              "source": "agent",
                              "status": "planned",
                          })
                          lines_text.append("%s %s-%s  %s（%d 分钟）" % (key, _hhmm(start), _hhmm(start + take), title, take))
                          used_per_day[key] = used_per_day.get(key, 0) + 1
                          remaining -= take
                          if first_day is None:
                              first_day = key

                      day += timedelta(days=1)

                  tasks.append({
                      "user_id": "demo",
                      "title": title,
                      "done": False,
                      "task_date": deadline or first_day or today.isoformat(),
                  })

              if not blocks:
                  text = "没找到合适的空档。可以告诉我可用的时间段，或者减少一点时长。"
              else:
                  text = "\n".join(lines_text)

              return {
                  "text": text,
                  "blocks_json": json.dumps(blocks, ensure_ascii=False),
                  "tasks_json": json.dumps(tasks, ensure_ascii=False),
                  "plan_json": json.dumps({"blocks": blocks, "tasks": tasks}, ensure_ascii=False),
                  "count": len(blocks),
              }

        code_language: python3
        outputs:
          blocks_json:
            children: null
            type: string
          count:
            children: null
            type: number
          plan_json:
            children: null
            type: string
          tasks_json:
            children: null
            type: string
          text:
            children: null
            type: string
