    - data:
        code: |

          import json
          from datetime import date, datetime


          def main(intent: str, intent_start: str, intent_end: str, stored: str, now_iso: str) -> dict:
              today = date.today()
              if now_iso:
                  try:
                      today = datetime.fromisoformat(now_iso).date()
                  except Exception:
                      pass

              try:
                  stored_data = json.loads(stored or "{}")
              except Exception:
                  stored_data = {}

              use_stored = (
                  str(intent or "").strip() == "review_feedback"
                  and bool(stored_data.get("start"))
                  and bool(stored_data.get("end"))
              )

              if use_stored:
                  start = str(stored_data.get("start"))[:10]
                  end = str(stored_data.get("end"))[:10]
              else:
                  start = str(intent_start or "").strip()[:10]
                  end = str(intent_end or "").strip()[:10]
                  if not start or not end:
                      start = end = today.isoformat()

              try:
                  s = date.fromisoformat(start)
                  e = date.fromisoformat(end)
              except Exception:
                  s = e = today

              days = (e - s).days + 1
              if days <= 3:
                  period = "day"
              elif days <= 10:
                  period = "week"
              else:
                  period = "month"

              return {
                  "start_date": s.isoformat(),
                  "end_date": e.isoformat(),
                  "period": period,
                  "days": days,
                  "range_json": json.dumps({"start": s.isoformat(), "end": e.isoformat(), "period": period}, ensure_ascii=False),
              }

        code_language: python3
        outputs:
          days:
            children: null
            type: number
          end_date:
            children: null
            type: string
          period:
            children: null
            type: string
