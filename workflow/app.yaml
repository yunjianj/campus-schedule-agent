    - id: plan_request
      type: custom
      data:
        title: 规划读取范围
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ obj(value, default=None):\n    if not isinstance(value, str):\n      \
          \  return value if value is not None else default\n    try:\n        return\
          \ json.loads(value)\n    except (ValueError, TypeError):\n        return\
          \ default\n\ndef model_json(raw):\n    text = re.sub(r'<think\\b[^>]*>.*?</think>',\
          \ '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'), text.rfind('}')\n\
          \    value = obj(text[start:end + 1], {}) if start >= 0 else {}\n    return\
          \ value if isinstance(value, dict) else {}\n\ndef iso(value):\n    return\
          \ date.fromisoformat(str(value)).isoformat()\n\ndef plan_request(raw, base_json,\
          \ pending_plan='', requested_start='', requested_end=''):\n    data = model_json(raw)\n\
          \    previous = obj(pending_plan, {})\n    limits = {**previous.get('constraints',\
          \ {}), **(data.get('constraints') or {})} if isinstance(data.get('constraints')\
          \ or {}, dict) else data['constraints']\n    if not isinstance(limits, dict):\n\
          \        raise ValueError('限制格式无效。')\n    today = date.fromisoformat(obj(base_json)['today'])\n\
          \    start = iso(limits.get('start_date') or requested_start or today.isoformat())\n\
          \    end = iso(limits.get('end_date') or requested_end or (date.fromisoformat(start)\
          \ + timedelta(days=7)).isoformat())\n    if end < start or (date.fromisoformat(end)\
          \ - date.fromisoformat(start)).days > 366:\n        raise ValueError('规划范围须为正序，且不超过一年。')\n\
          \    return {'start_date': start, 'end_date': end,\n            'schedule_params':\
          \ 'event_date=gte.' + start + '&event_date=lte.' + end + '&order=event_date.asc,start_time.asc&limit=1000'}\n\
          \ndef main(raw, base_json, pending_plan, requested_start, requested_end):\n\
          \    return plan_request(raw=raw, base_json=base_json, pending_plan=pending_plan,\
          \ requested_start=requested_start, requested_end=requested_end)\n"
        variables:
