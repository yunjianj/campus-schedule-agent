          \ ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n    return int(m[1]) * 60\
          \ + int(m[2])\n\ndef clock(value):\n    return '%02d:%02d' % divmod(value,\
          \ 60)\n\ndef windows(value):\n    if not isinstance(value, list):\n    \
          \    raise ValueError('时段须为二维数组。')\n    result = []\n    for pair in value:\n\
          \        if not isinstance(pair, list) or len(pair) != 2 or hm(pair[0])\
          \ >= hm(pair[1]):\n            raise ValueError('时段起止无效。')\n        result.append([str(pair[0]),\
          \ str(pair[1])])\n    return result\n\ndef profile_checked(raw):\n    if\
          \ not isinstance(raw, dict) or set(raw) - PROFILE_KEYS:\n        raise ValueError('画像字段不受支持。')\n\
          \    if len(dumps(raw)) > 12000:\n        raise ValueError('画像过长，请减少节次或限制条目。')\n\
          \    p = dict(DEFAULT_PROFILE)\n    p.update(raw)\n    ZoneInfo(p['timezone'])\n\
          \    if p['semester_start']:\n        d = date.fromisoformat(p['semester_start'])\n\
          \        if d.weekday() != 0:\n            raise ValueError('学期第一周起始日必须为周一。')\n\
          \    if not isinstance(p['lessons'], dict):\n        raise ValueError('节次表须为对象。')\n\
          \    for key, pair in p['lessons'].items():\n        if not str(key).isdigit()\
