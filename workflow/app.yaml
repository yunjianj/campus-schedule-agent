        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef rows(body, status=200, allow_limit=False):\n\
          \    value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef context_items(records):\n  \
          \  \"\"\"The displayed result, not an LLM's prose, defines subsequent referents.\"\
          \"\"\n    fields = ('id', 'title', 'event_date', 'start_time', 'end_time',\
          \ 'location', 'category')\n    return [{k: r.get(k) for k in fields} for\
          \ r in records if r.get('id')]\n\ndef operation_context(schedule_body, task_body,\
          \ start_date, end_date, base_json):\n    schedules, tasks = rows(schedule_body),\
          \ rows(task_body)\n    allowed = ('id', 'title', 'event_date', 'start_time',\
          \ 'end_time', 'location', 'category', 'status', 'manual_override')\n   \
          \ clean = [{k: r.get(k) for k in allowed} for r in schedules]\n    task_clean\
          \ = [{k: r.get(k) for k in ('id', 'title', 'task_date', 'done')} for r in\
          \ tasks]\n    summary = {'range': [start_date, end_date], 'schedule_count':\
          \ len(clean), 'task_count': len(tasks)}\n    daily = {}\n    for r in clean:\n\
          \        entry = daily.setdefault(r['event_date'], {'count': 0, 'minutes':\
          \ 0})\n        entry['count'] += 1\n        entry['minutes'] += max(0, hm(r['end_time'])\
          \ - hm(r['start_time']))\n    summary['days'] = dict(sorted(daily.items())[:60])\n\
          \    summary['days_truncated'] = len(daily) > 60\n    lines = ['\U0001F4C6\
          \ **%s 至 %s**' % (start_date or '不限', end_date or '不限')]\n    if clean:\n\
          \        lines.append('### \U0001F4C5 已安排的日程（%d 项）' % len(clean))\n    \
          \    for i,r in enumerate(clean):\n            lines.append('%d. **%s %s–%s\
          \ %s**\\n\\n   \U0001F4CD %s' % (\n                i+1,r['event_date'],str(r['start_time'])[:5],str(r['end_time'])[:5],r['title'],r.get('location')\
          \ or '地点待定'))\n    else:\n        lines.append('\U0001F4C5 这段时间暂无日程记录。')\n\
          \    if task_clean:\n        lines.append('### \U0001F4DD 待办任务（%d 项）' %\
          \ len(task_clean))\n        lines += ['- **%s** · %s · %s' % (r['title'],r['task_date'],'✅\
          \ 已完成' if r['done'] else '待完成') for r in task_clean]\n    else:\n      \
          \  lines.append('\U0001F4DD 这段时间任务栏里暂无待办记录。')\n    if not clean and not\
          \ tasks:\n        lines.append('该范围没有日程或任务记录。')\n    if len('\\n'.join(lines))\
          \ > 40000:\n        raise ValueError('完整清单过长，请缩小日期范围。')\n    refs = context_items(clean)\n\
          \    return {'body': dumps(clean), 'tasks': dumps(task_clean), 'summary':\
          \ dumps(summary),\n            'listing': '\\n\\n'.join(lines), 'references':\
          \ dumps(refs),\n            'operation_context': dumps({'summary': summary,\
          \ 'profile': obj(base_json)['profile']})}\n\ndef main(schedule_body, task_body,\
          \ start_date, end_date, base_json):\n    return operation_context(schedule_body=schedule_body,\
          \ task_body=task_body, start_date=start_date, end_date=end_date, base_json=base_json)\n"
