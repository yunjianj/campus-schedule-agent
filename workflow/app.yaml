        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef rows(body, status=200, allow_limit=False):\n\
          \    value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef review_stats(schedule_body,\
          \ task_body, reviews_body, start_date, end_date, period, feedback):\n  \
          \  schedules, tasks = rows(schedule_body), rows(task_body)\n    history\
          \ = rows(reviews_body, allow_limit=True)[:3]\n    manual = [r for r in schedules\
          \ if r.get('status') == 'done' and r.get('manual_override') is True]\n \
          \   auto = [r for r in schedules if r.get('status') == 'done' and r.get('manual_override')\
          \ is not True]\n    unfinished = [r for r in schedules if r.get('status')\
          \ != 'done']\n    task_done = [t for t in tasks if t.get('done') is True]\n\
          \    categories = {}\n    for r in schedules:\n        cat = r.get('category')\
          \ or '其他'\n        categories[cat] = categories.get(cat, 0) + hm(r['end_time'])\
          \ - hm(r['start_time'])\n    stats = {'schedule_total': len(schedules),\
          \ 'done_manual': len(manual), 'done_auto': len(auto),\n             'undone':\
          \ len(unfinished), 'task_total': len(tasks), 'task_done': len(task_done),\
          \ 'categories': categories}\n    lines = []\n    for label, group in [('手动确认完成',\
          \ manual), ('按时间默认完成（未人工核实）', auto), ('未完成/待确认', unfinished)]:\n       \
          \ lines.append(label + '：' + ('；'.join(r['event_date'] + ' ' + r['title']\
          \ for r in group) or '无'))\n    lines += ['任务 %s %s（%s）' % (t['task_date'],\
          \ t['title'], '已完成' if t['done'] else '未完成') for t in tasks]\n    history_context\
          \ = [{'range_start': h.get('range_start'), 'range_end': h.get('range_end'),\n\
          \                        'stats': h.get('stats') or {}, 'advice_summary':\
          \ h.get('advice_summary') or '旧报告无结构化建议摘要'} for h in history]\n    # Bound\
          \ model details without losing totals or the complete code-rendered list.\n\
          \    if len('\\n'.join(lines)) > 60000:\n        raise ValueError('复盘清单过长，请缩小日期范围。')\n\
          \    return {'summary': dumps(stats), 'items': '\\n'.join(lines)[:12000],\
          \ 'listing': '\\n'.join(lines),\n            'history': dumps(history_context),\
          \ 'feedback': feedback or '[]', 'stats_json': dumps(stats),\n          \
          \  'ask_text': '%s 至 %s\\n%s\\n\\n未完成的原因是什么？有什么经验或下一步想法？可以分几次补充，最后说“生成报告”。'\
          \ % (start_date, end_date, '\\n'.join(lines))}\n\ndef main(schedule_body,\
          \ task_body, reviews_body, start_date, end_date, period, feedback):\n  \
          \  return review_stats(schedule_body=schedule_body, task_body=task_body,\
          \ reviews_body=reviews_body, start_date=start_date, end_date=end_date, period=period,\
          \ feedback=feedback)\n"
        variables:
