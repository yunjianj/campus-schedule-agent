    - id: journal_result
      type: custom
      data:
        title: 核对记忆保存与保留重试信息
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef rows(body, status=200, allow_limit=False):\n\
          \    value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef rpc_bundle(body, status=200):\n    result=rows(body,status,allow_limit=True)\n\
          \    if len(result)!=1 or not isinstance(result[0].get('bundle'),dict):\n\
          \        raise ValueError('上下文文档响应格式错误。')\n    return result[0]['bundle']\n\
          \ndef journal_result(body, status, text, payload):\n    try:\n        rpc_bundle(body,status)\n\
          \        return {'text':text,'pending_sync':''}\n    except (ValueError,TypeError):\n\
          \        warning='⚠️ 本轮结果已返回，但上下文文档暂未同步；下轮只重试记忆保存，不重复执行日程操作。'\n        data=obj(payload,{})\n\
          \        data['p_assistant_text']=text+'\\n\\n'+warning\n        return\
          \ {'text':data['p_assistant_text'],'pending_sync':dumps(data)}\n\ndef main(body,\
          \ status, text, payload):\n    return journal_result(body=body, status=status,\
          \ text=text, payload=payload)\n"
        variables:
        - variable: body
          value_selector:
          - memory_finish
          - body
        - variable: status
          value_selector:
          - memory_finish
          - status_code
        - variable: text
          value_selector:
          - finish_turn
          - text
        - variable: payload
          value_selector:
          - journal_body
          - body
        outputs:
          text:
            type: string
            children: null
          pending_sync:
            type: string
            children: null
