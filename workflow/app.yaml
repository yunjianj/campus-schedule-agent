    - id: plan_slots
      type: custom
      data:
        title: 执行偏好并排时间块
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef model_data(value):\n    \"\"\"Remove service\
          \ identity/configuration fields from model-facing state.\"\"\"\n    if isinstance(value,\
          \ str) and value[:1] in ('{','['):\n        parsed = obj(value)\n      \
          \  if isinstance(parsed,(dict,list)):\n            return model_data(parsed)\n\
          \    if isinstance(value, dict):\n        return {k:model_data(v) for k,v\
          \ in value.items() if k.lower() not in\n                ('user_id','conversation_id','apikey','supabase_key','authorization','access_token','refresh_token','pending_memory_sync')}\n\
          \    if isinstance(value, list):\n        return [model_data(v) for v in\
          \ value]\n    return value\n\ndef model_json(raw):\n    text = re.sub(r'<think\\\
          b[^>]*>.*?</think>', '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'),\
          \ text.rfind('}')\n    value = obj(text[start:end + 1], {}) if start >=\
          \ 0 else {}\n    return value if isinstance(value, dict) else {}\n\ndef\
          \ rows(body, status=200, allow_limit=False):\n    value = obj(body)\n  \
          \  if not 200 <= int(status) < 300 or not isinstance(value, list):\n   \
          \     raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value) >= 1000\
          \ and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef clock(value):\n    return '%02d:%02d'\
          \ % divmod(value, 60)\n\ndef iso(value):\n    return date.fromisoformat(str(value)).isoformat()\n\
          \ndef windows(value):\n    if not isinstance(value, list):\n        raise\
          \ ValueError('时段须为二维数组。')\n    result = []\n    for pair in value:\n   \
          \     if not isinstance(pair, list) or len(pair) != 2 or hm(pair[0]) >=\
          \ hm(pair[1]):\n            raise ValueError('时段起止无效。')\n        result.append([str(pair[0]),\
          \ str(pair[1])])\n    return result\n\ndef subtract_slots(allowed, busy):\n\
          \    merged = []\n    for a, b in sorted(busy):\n        if merged and a\
          \ <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], b)\n\
          \        else:\n            merged.append([a, b])\n    # Union allowed windows\
          \ too, so overlapping preferences never duplicate availability.\n    union\
          \ = []\n    for a, b in sorted(allowed):\n        if union and a <= union[-1][1]:\n\
          \            union[-1][1] = max(union[-1][1], b)\n        else:\n      \
          \      union.append([a, b])\n    out = []\n    for a, b in union:\n    \
          \    cursor = a\n        for s, e in merged:\n            if e <= cursor\
          \ or s >= b:\n                continue\n            if s > cursor:\n   \
          \             out.append((cursor, min(s, b)))\n            cursor = max(cursor,\
          \ e)\n        if cursor < b:\n            out.append((cursor, b))\n    return\
          \ out\n\ndef plan_slots(raw, body, base_json, start_date, end_date, user_id,\
          \ pending_plan=''):\n    base, payload = obj(base_json), model_json(raw)\n\
          \    profile = base['profile']\n    previous = obj(pending_plan, {})\n \
          \   constraints = {**previous.get('constraints', {}), **(payload.get('constraints')\
          \ or {})} if isinstance(payload.get('constraints') or {}, dict) else payload['constraints']\n\
          \    if not isinstance(constraints, dict):\n        raise ValueError('规划限制须为结构化对象。')\n\
          \    if payload.get('unsupported_constraints'):\n        raise ValueError('暂不支持这些限制，请具体化为日期或时段：'\
          \ + str(payload['unsupported_constraints']))\n    unknown = set(constraints)\
          \ - {'start_date','end_date','allowed_windows','blocked_windows','blocked_dates','max_blocks_per_day'}\n\
          \    if unknown:\n        raise ValueError('不支持的限制字段：' + ','.join(sorted(unknown)))\n\
          \    blocked_dates = constraints.get('blocked_dates', {})\n    if not isinstance(blocked_dates,\
          \ dict):\n        raise ValueError('按日期禁用时段格式无效。')\n    for day, pairs in\
          \ blocked_dates.items():\n        iso(day)\n        windows(pairs)\n   \
          \ # Temporary allowed windows narrow, never widen, persistent availability.\n\
          \    allowed = [(hm(a), hm(b)) for a, b in profile['allowed_windows']]\n\
          \    if constraints.get('allowed_windows'):\n        temporary = [(hm(a),\
          \ hm(b)) for a, b in windows(constraints['allowed_windows'])]\n        allowed\
          \ = [(max(a, c), min(b, d)) for a, b in allowed for c, d in temporary if\
          \ max(a, c) < min(b, d)]\n    blocked = [(hm(a), hm(b)) for a, b in profile['blocked_windows']\
          \ + windows(constraints.get('blocked_windows', []))]\n    maximum = min(profile['max_blocks_per_day'],\
          \ int(constraints.get('max_blocks_per_day') or profile['max_blocks_per_day']))\n\
          \    if maximum < 1:\n        raise ValueError('每天至少允许一个时间块。')\n    now\
          \ = datetime.fromisoformat(base['now'])\n    lo = max(date.fromisoformat(start_date),\
          \ now.date())\n    hi = date.fromisoformat(end_date)\n    if constraints.get('start_date'):\n\
          \        lo = max(lo, date.fromisoformat(constraints['start_date']))\n \
          \   if constraints.get('end_date'):\n        hi = min(hi, date.fromisoformat(constraints['end_date']))\n\
          \    busy, counts = {}, {}\n    for row in rows(body):\n        busy.setdefault(row['event_date'],\
          \ []).append((hm(row['start_time']), hm(row['end_time'])))\n    previous\
          \ = obj(pending_plan, {})\n    goals = payload.get('goals') or previous.get('goals')\
          \ or []\n    if len(goals) > 5:\n        raise ValueError('一次最多规划 5 个目标。')\n\
          \    def gaps(day, study=False):\n        exclusions = busy.get(day.isoformat(),\
          \ []) + blocked + [(hm(a), hm(b)) for a, b in blocked_dates.get(day.isoformat(),\
          \ [])]\n        if study:\n            exclusions = exclusions + [(hm(a),\
          \ hm(b)) for a, b in profile['study_blocked_windows']]\n        if day ==\
          \ now.date():\n            exclusions = exclusions + [(0, now.hour * 60\
          \ + now.minute + (1 if now.second or now.microsecond else 0))]\n       \
          \ return subtract_slots(allowed, exclusions)\n    free_lines, day = [],\
          \ lo\n    while day <= hi:\n        slots = [(a, b) for a, b in gaps(day)\
          \ if b - a >= 60]\n        if slots:\n            free_lines.append(day.isoformat()\
          \ + ' ' + '、'.join(clock(a) + '–' + clock(b) for a, b in slots))\n     \
          \   day += timedelta(days=1)\n    blocks, tasks, unallocated, assumptions\
          \ = [], [], [], []\n    def order(g):\n        return (g.get('deadline')\
          \ or '9999-12-31', {'高': 0, '中': 1, '低': 2}.get(g.get('priority'), 1))\n\
          \    for goal in sorted(goals, key=order):\n        title = str(goal.get('title')\
          \ or '').strip()\n        if not title:\n            continue\n        duration\
          \ = goal.get('duration_min')\n        if not duration:\n            duration\
          \ = 60\n            assumptions.append(title + '：时长按 60 分钟估算')\n       \
          \ remaining = int(duration)\n        if remaining <= 0 or remaining > 10080:\n\
          \            raise ValueError('目标时长须在 1–10080 分钟内。')\n        last = min(hi,\
          \ date.fromisoformat(goal['deadline'])) if goal.get('deadline') else hi\n\
          \        day, first = lo, None\n        while day <= last and remaining\
          \ >= 60:\n            key = day.isoformat()\n            while counts.get(key,\
          \ 0) < maximum and remaining >= 60:\n                slots = [(a, b) for\
          \ a, b in gaps(day, goal.get('category') == '学习') if b-a >= 60]\n      \
          \          if not slots:\n                    break\n                a,\
          \ b = slots[0]\n                take = min(120, b-a, remaining)\n      \
          \          block = {'user_id': user_id, 'title': title, 'event_date': key,\
          \ 'start_time': clock(a), 'end_time': clock(a+take), 'location': '', 'category':\
          \ '个人事项', 'note': '来自智能体规划', 'source': 'agent', 'status': 'planned'}\n \
          \               blocks.append(block)\n                busy.setdefault(key,\
          \ []).append((a, a+take))\n                counts[key] = counts.get(key,\
          \ 0) + 1\n                remaining -= take\n                first = first\
          \ or key\n            day += timedelta(days=1)\n        tasks.append({'user_id':\
          \ user_id, 'title': title, 'done': False, 'task_date': goal.get('deadline')\
          \ or first or base['today']})\n        if remaining:\n            unallocated.append({'title':\
          \ title, 'remaining_min': remaining})\n    lines = ['%s %s–%s %s' % (b['event_date'],\
          \ b['start_time'], b['end_time'], b['title']) for b in blocks]\n    plan\
          \ = {'blocks': blocks, 'tasks': tasks, 'goals': goals, 'constraints': constraints,\
          \ 'created_at': base['now']}\n    return {'text': '\\n'.join(lines) or '没有排出时间块。',\
          \ 'free_text': '\\n'.join(free_lines) or '没有符合限制的整块空档。',\n            'plan_json':\
          \ dumps(plan), 'model_plan': dumps(model_data(plan)), 'unallocated': dumps(unallocated),\
          \ 'assumptions': dumps(assumptions),\n            'applied_constraints':\
          \ dumps({'profile': profile, 'temporary': constraints}),\n            'count':\
          \ len(blocks), 'stage': 'awaiting' if blocks or tasks else ''}\n\ndef main(raw,\
          \ body, base_json, start_date, end_date, user_id, pending_plan):\n    return\
          \ plan_slots(raw=raw, body=body, base_json=base_json, start_date=start_date,\
          \ end_date=end_date, user_id=user_id, pending_plan=pending_plan)\n"
        variables:
