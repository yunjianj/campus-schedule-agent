        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef model_json(raw):\n    text = re.sub(r'<think\\\
          b[^>]*>.*?</think>', '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'),\
          \ text.rfind('}')\n    value = obj(text[start:end + 1], {}) if start >=\
          \ 0 else {}\n    return value if isinstance(value, dict) else {}\n\ndef\
          \ report_row(raw, stats_json, start_date, end_date, period, user_id):\n\
          \    data = model_json(raw)\n    report = data.get('report')\n    advice\
          \ = data.get('advice_summary')\n    if not isinstance(report, str) or not\
          \ report.strip() or not isinstance(advice, str) or len(advice) > 1200:\n\
          \        raise ValueError('复盘报告格式错误，未保存。')\n    return {'report': report,\
          \ 'row_json': dumps({'user_id': user_id, 'period': period, 'range_start':\
          \ start_date,\n            'range_end': end_date, 'report': report, 'advice_summary':\
          \ advice, 'stats': obj(stats_json)})}\n\ndef main(raw, stats_json, start_date,\
          \ end_date, period, user_id):\n    return report_row(raw=raw, stats_json=stats_json,\
          \ start_date=start_date, end_date=end_date, period=period, user_id=user_id)\n"
