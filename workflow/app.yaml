      data:
        title: 确定业务读取范围
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef iso(value):\n    return date.fromisoformat(str(value)).isoformat()\n\
          \ndef pending_delete_ids(state):\n    \"\"\"Only the snapshot shown to the\
          \ user may authorize a confirmation lookup.\"\"\"\n    import uuid\n   \
          \ candidates=obj(state.get('delete_candidates'),[])\n    if not isinstance(candidates,list)\
          \ or not candidates or state.get('delete_stage')!='confirm':return []\n\
          \    ids=[]\n    try:\n        for row in candidates:\n            ident=str(uuid.UUID(str(row['id'])))\n\
          \            if ident not in ids:ids.append(ident)\n        if str(uuid.UUID(str(state.get('pending_delete')\
          \ or ''))) not in ids:return []\n    except (ValueError,TypeError,KeyError,AttributeError):return\
          \ []\n    return ids\n\ndef request_context(intent, start_date, end_date,\
          \ target, reference_id, state_json, base_json, target_time='', delete_confirmed='false'):\n\
          \    base = obj(base_json, {})\n    state = obj(state_json, {})\n    today\
          \ = date.fromisoformat(base['today'])\n    start, end = start_date, end_date\n\
          \    if intent=='delete' and delete_confirmed=='true':\n        reference_id=','.join(pending_delete_ids(state))\n\
          \        start=end=target=target_time=''\n        if not reference_id:\n\
          \            return {'schedule_params':'id=is.null&limit=0','task_params':'limit=0','start_date':'','end_date':'','period':'day','range_json':'{}'}\n\
          \    if intent == 'review_feedback':\n        stored = obj(state.get('review_range'),\
          \ {})\n        start, end = stored.get('start'), stored.get('end')\n   \
          \ if intent == 'plan_confirm':\n        plan = obj(state.get('pending_plan'),\
          \ {})\n        days = [b['event_date'] for b in plan.get('blocks', [])]\n\
          \        start, end = (min(days), max(days)) if days else (base['today'],\
          \ base['today'])\n    if not start:\n        start = base['today'] if intent\
          \ in ('query', 'review', 'plan', 'plan_confirm') else ''\n    if not end:\n\
          \        end = (today + timedelta(days=7)).isoformat() if intent == 'plan'\
          \ else start\n    if start:\n        start, end = iso(start), iso(end or\
          \ start)\n        if start > end:\n            start, end = end, start\n\
          \    filters = []\n    if reference_id:\n        import uuid\n        ids\
          \ = [str(uuid.UUID(x)) for x in reference_id.split(',')]\n        filters.append('id=in.('\
          \ + ','.join(ids) + ')')\n    if start:\n        filters += ['event_date=gte.'\
          \ + start, 'event_date=lte.' + end]\n    if target and intent in ('update',\
          \ 'delete'):\n        # Encode a PostgREST quoted literal, escaping its\
          \ grammar and LIKE wildcards.\n        literal = target.replace('\\\\',\
          \ '\\\\\\\\').replace('\"', '\\\\\"').replace('%', '\\\\%').replace('_',\
          \ '\\\\_').replace('*', '\\\\*')\n        filters.append('title=like.' +\
          \ quote('\"*' + literal + '*\"', safe=''))\n    if target_time and intent\
          \ in ('update','delete'):\n        hm(target_time)\n        filters.append('start_time=eq.'\
          \ + target_time)\n    if intent in ('update','delete') and not filters:\n\
          \        filters.append('id=is.null')\n    schedule_params = '&'.join(filters\
          \ + ['order=event_date.asc,start_time.asc', 'limit=1000'])\n    task_params\
          \ = ('task_date=gte.' + start + '&task_date=lte.' + end + '&' if start else\
          \ '') + 'order=task_date.asc&limit=1000'\n    if intent not in ('query',\
          \ 'review', 'review_feedback'):\n        task_params = 'limit=0'\n    period\
          \ = 'day'\n    if start:\n        days = (date.fromisoformat(end) - date.fromisoformat(start)).days\
          \ + 1\n        period = 'day' if days <= 3 else 'week' if days <= 10 else\
          \ 'month'\n    return {'schedule_params': schedule_params, 'task_params':\
          \ task_params,\n            'start_date': start, 'end_date': end, 'period':\
          \ period,\n            'range_json': dumps({'start': start, 'end': end,\
