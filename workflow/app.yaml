    - id: validate
      type: custom
      data:
        title: 分流与冲突检查
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef rows(body, status=200, allow_limit=False):\n\
          \    value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef validate_add(prepared, body,\
          \ user_id, base_json):\n    existing = rows(body)\n    events, tasks, summary\
          \ = [], [], []\n    for r in obj(prepared)['items']:\n        if r.get('start_time'):\n\
          \            event = {'user_id': user_id, 'title': r['title'], 'event_date':\
          \ r['date'],\n                     'start_time': r['start_time'], 'end_time':\
          \ r['end_time'],\n                     'location': r.get('location') or\
          \ '', 'category': r.get('category') or '其他',\n                     'note':\
          \ '结束时间按默认 60 分钟估算' if r.get('estimated_end') else '', 'source': 'agent',\
          \ 'status': 'planned'}\n            hits = [x['title'] for x in existing\
          \ + events if x['event_date'] == event['event_date'] and hm(event['start_time'])\
          \ < hm(x['end_time']) and hm(x['start_time']) < hm(event['end_time'])]\n\
          \            events.append(event)\n            summary.append('%s %s %s–%s%s%s'\
          \ % (r['title'], r['date'], r['start_time'], r['end_time'], '（结束时间按 60 分钟估算）'\
          \ if r.get('estimated_end') else '', '；与' + '、'.join(hits) + '冲突' if hits\
          \ else ''))\n        else:\n            tasks.append({'user_id': user_id,\
          \ 'title': r['title'], 'task_date': r.get('date') or obj(base_json)['today'],\
          \ 'done': False})\n            summary.append(r['title'] + '｜已放任务栏')\n \
          \   return {'events_json': dumps(events), 'tasks_json': dumps(tasks), 'summary':\
          \ '\\n'.join(summary)}\n\ndef main(prepared, body, user_id, base_json):\n\
          \    return validate_add(prepared=prepared, body=body, user_id=user_id,\
          \ base_json=base_json)\n"
        variables:
        - variable: prepared
          value_selector:
          - prepare_add
          - prepared
        - variable: body
          value_selector:
          - add_window
          - body
        - variable: user_id
          value_selector:
          - env
          - USER_ID
        - variable: base_json
          value_selector:
          - now
          - base_context
        outputs:
          events_json:
            type: string
            children: null
          tasks_json:
            type: string
            children: null
          summary:
            type: string
            children: null
