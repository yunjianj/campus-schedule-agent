        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef rows(body, status=200, allow_limit=False):\n\
          \    value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef rpc_bundle(body, status=200):\n    result=rows(body,status,allow_limit=True)\n\
          \    if len(result)!=1 or not isinstance(result[0].get('bundle'),dict):\n\
          \        raise ValueError('上下文文档响应格式错误。')\n    return result[0]['bundle']\n\
          \ndef memory_recall_context(body, control_json, state_json, query='', base_json=''):\n\
          \    bundle=rpc_bundle(body)\n    control=obj(control_json,{})\n    state=obj(state_json,{})\n\
          \    existing=obj(state.get('active_list'),{})\n    choices=''\n    def\
          \ local_time(value):\n        if not base_json:return value\n        tz=ZoneInfo(obj(base_json)['profile']['timezone'])\n\
          \        return datetime.fromisoformat(value.replace('Z','+00:00')).astimezone(tz).strftime('%Y-%m-%d\
          \ %H:%M:%S %z')\n    chosen=bundle.get('scope') or {}\n    focus=state.get('last_referenced_items')\
          \ or ''\n    focus_source=state.get('focus_entry_id') or ''\n    if control.get('historical')\
          \ and not control.get('view'):\n        scopes=bundle.get('scopes') or []\n\
          \        if len(scopes)>1 and not chosen:\n            choices=dumps({'scopes':scopes,'instruction':query})\n\
          \            control['ambiguous_scopes']='\\n'.join('第%d张：%s · %s' % (i+1,local_time(r['created_at']),r.get('label')\
          \ or '日程列表') for i,r in enumerate(scopes))\n        elif chosen:\n     \
          \       state['active_list']=dumps(chosen)\n            focus=dumps(chosen.get('items',[]))\n\
          \            focus_source=chosen.get('scope_id','')\n    elif chosen and\
          \ chosen.get('scope_id')!=existing.get('scope_id'):\n        # Never adopt\
          \ another chat's ordinal scope merely because a model recalled it.\n   \
          \     chosen={}\n    records=bundle.get('entries') or []\n    chunks=[]\n\
          \    view=['### \U0001F4D6 上下文文档']\n    budget=12000\n    snippet=min(2000,max(100,(12000//max(1,len(records[:8]))-900)//2))\n\
          \    for record in records[:8]:\n        data={k:record.get(k) for k in\
          \ ('id','created_at','summary','topics')}\n        data['summary']=str(data.get('summary')\
          \ or '')[:200]\n        data['topics']=(data.get('topics') or [])[:3]\n\
          \        data['user_text']=str(record.get('user_text') or '')[:snippet]\n\
          \        data['assistant_text']=str(record.get('assistant_text') or '')[:snippet]\n\
          \        encoded=dumps(data)\n        if len(encoded)<=budget:\n       \
          \     chunks.append(data);budget-=len(encoded)\n        view.append('**%s**\\\
          n\\n%s' % (local_time(record['created_at']),record.get('summary') or '（本轮暂无摘要）'))\n\
          \        if control.get('view_raw'):\n            raw_text='用户：'+str(record.get('user_text')\
          \ or '')+'\\n\\n助手：'+str(record.get('assistant_text') or '')\n         \
          \   remaining=max(0,40000-sum(len(x) for x in view))\n            view.append(raw_text[:remaining]+('\\\
          n\\n（原文较长，本次展示部分内容；完整原文仍保存在上下文文档中。）' if len(raw_text)>remaining else ''))\n\
          \    if not chunks:view.append('当前范围没有可用的历史记录；尚未开始记录或旧记忆已按保留策略清理。')\n  \
          \  scope=state.get('active_list') or ''\n    return {'active_list':scope,'focus':focus,'focus_source':focus_source,'choices':choices,'effective_query':control.get('replay_query')\
          \ or query,'context':dumps({'records':chunks,'historical':control.get('historical',False)}),\n\
          \            'control':dumps(control),'document_text':'\\n\\n'.join(view)}\n\
          \ndef main(body, control_json, state_json, query, base_json):\n    return\
          \ memory_recall_context(body=body, control_json=control_json, state_json=state_json,\
          \ query=query, base_json=base_json)\n"
