      type: custom
      data:
        title: 合并润色与原始结果
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ obj(value, default=None):\n    if not isinstance(value, str):\n      \
          \  return value if value is not None else default\n    try:\n        return\
          \ json.loads(value)\n    except (ValueError, TypeError):\n        return\
          \ default\n\ndef model_json(raw):\n    text = re.sub(r'<think\\b[^>]*>.*?</think>',\
          \ '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'), text.rfind('}')\n\
          \    value = obj(text[start:end + 1], {}) if start >= 0 else {}\n    return\
          \ value if isinstance(value, dict) else {}\n\ndef chinese_number(value):\n\
          \    if value.isdigit():\n        return int(value)\n    digits = dict(zip('零一二三四五六七八九',\
          \ range(10)))\n    digits['两'] = 2\n    if '十' in value:\n        a, _,\
          \ b = value.partition('十')\n        return (digits.get(a, 1) if a else 1)\
          \ * 10 + (digits.get(b, 0) if b else 0)\n    return digits.get(value, -1)\n\
          \ndef compose_polish(text, raw):\n    \"\"\"Keep canonical facts; validate\
          \ each framing part without banning ordinary words.\"\"\"\n    data = model_json(raw)\n\
          \    opening, closing = data.get('opening', ''), data.get('closing', '')\n\
          \    if not isinstance(opening,str) or not isinstance(closing,str):\n  \
          \      return {'text':text}\n    numbers=set(re.findall(r'\\d+(?::\\d+)?',text))\n\
          \    first_line=text.split('\\n',1)[0]\n    def allowed(part):\n       \
          \ if len(part)>80:\n            return False\n        if re.search(r'没有待处理|没有待确认|无待处理|无待确认|没有匹配|没找到|找不到',part)\
          \ and not re.search(r'没有待处理|没有待确认|无待处理|无待确认|没有匹配|没找到|找不到',text):\n     \
          \       return False\n        if re.search(r'空闲|有空|空着|自由|充裕|冲突|没安排|没有安排|全部完成',part):\n\
          \            return False\n        for number in re.findall(r'\\d+(?::\\\
          d+)?',part):\n            if number not in numbers:return False\n      \
          \  for number,unit in re.findall(r'([零一二两三四五六七八九十]+)(条|个|场|项|小时|分钟|点|时|分|月|日|号|年)',part):\n\
          \            if unit in ('点','时','分','月','日','号','年') or str(chinese_number(number))\
          \ not in numbers:\n                return False\n        if re.search(r'周[一二三四五六日天]|星期[一二三四五六日天]',part):\n\
          \            return False\n        for claim in re.finditer(r'(?:已(?:经)?(?:帮你)?|操作)(保存|删除|修改|完成|取消|写入|更新|安排)',part):\n\
          \            action=claim[1]\n            if action=='更新':action='修改'\n\
          \            if not re.search(r'已[^\\n]{0,5}'+action,first_line):return\
          \ False\n        if re.search(r'保存成功|删除成功|修改成功|安排好了|搞定了',part) and not re.search(r'已保存|已删除|已修改|规划已保存',first_line):\n\
          \            return False\n        return True\n    # One rejected closing\
          \ no longer discards an otherwise useful opening.\n    opening=opening.strip()\
          \ if allowed(opening) else ''\n    closing=closing.strip() if allowed(closing)\
          \ else ''\n    return {'text':'\\n\\n'.join(part for part in (opening,text,closing)\
          \ if part)}\n\ndef main(text, raw):\n    return compose_polish(text=text,\
          \ raw=raw)\n"
        variables:
