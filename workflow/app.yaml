          \ str) or len(p['reply_style']) > 200:\n        raise ValueError('回复偏好须为不超过\
          \ 200 字的文本。')\n    return p\n\ndef context_items(records):\n    \"\"\"The\
          \ displayed result, not an LLM's prose, defines subsequent referents.\"\"\
          \"\n    fields = ('id', 'title', 'event_date', 'start_time', 'end_time',\
          \ 'location', 'category')\n    return [{k: r.get(k) for k in fields} for\
          \ r in records if r.get('id')]\n\ndef chinese_number(value):\n    if value.isdigit():\n\
          \        return int(value)\n    digits = dict(zip('零一二三四五六七八九', range(10)))\n\
          \    digits['两'] = 2\n    if '十' in value:\n        a, _, b = value.partition('十')\n\
          \        return (digits.get(a, 1) if a else 1) * 10 + (digits.get(b, 0)\
          \ if b else 0)\n    return digits.get(value, -1)\n\ndef date_span(text,\
          \ base):\n    \"\"\"Resolve common explicit selectors without borrowing\
          \ dates from model memory.\"\"\"\n    today = date.fromisoformat(base['today'])\n\
          \    m = re.search(r'(20\\d{2})[-年/](\\d{1,2})[-月/](\\d{1,2})日?', text)\n\
          \    if m:\n        day = date(int(m[1]), int(m[2]), int(m[3]))\n      \
          \  return day.isoformat(), day.isoformat()\n    m = re.search(r'(?<!\\d)(\\\
          d{1,2})月(\\d{1,2})[日号]?', text)\n    if m:\n        day = date(today.year,\
