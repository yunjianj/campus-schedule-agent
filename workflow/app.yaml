    - id: upd_row
      type: custom
      data:
        title: 校验修改后的日期时间
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef clock(value):\n    return '%02d:%02d'\
          \ % divmod(value, 60)\n\ndef iso(value):\n    return date.fromisoformat(str(value)).isoformat()\n\
          \ndef patch_event(item_json, new_date, new_start, new_end, new_location='',\
          \ new_title=''):\n    item = obj(item_json)\n    patch = {}\n    if new_date:\n\
          \        patch['event_date'] = iso(new_date)\n    start = hm(new_start)\
          \ if new_start else hm(item['start_time'])\n    end = hm(new_end) if new_end\
          \ else start + hm(item['end_time']) - hm(item['start_time'])\n    if not\
          \ 0 <= start < end < 1440:\n        raise ValueError('修改后的起止时间无效，不能跨日。')\n\
          \    if new_start or new_end:\n        patch.update(start_time=clock(start),\
          \ end_time=clock(end))\n    for key,value in (('location',new_location),('title',new_title)):\n\
          \        if value:\n            if not isinstance(value,str) or not value.strip()\
          \ or len(value)>500:\n                raise ValueError('地点或标题须为 1–500 字符。')\n\
          \            patch[key]=value.strip()\n    if not patch:\n        raise\
          \ ValueError('请说明修改后的日期、时间、地点或标题。')\n    updated={**item,**patch}\n    changes=[]\n\
          \    for key,label in (('location','\U0001F4CD 地点'),('title','\U0001F4DD\
          \ 标题')):\n        if key in patch:changes.append('%s：%s → **%s**' % (label,item.get(key)\
          \ or '未填写',patch[key]))\n    receipt='日程已修改 ✨\\n\\n**%s**\\n\\n\U0001F4C5\
          \ %s · %s–%s' % (updated['title'],updated['event_date'],str(updated['start_time'])[:5],str(updated['end_time'])[:5])\n\
          \    receipt+='\\n\\n'+('\\n\\n'.join(changes) if changes else '\U0001F4CD\
          \ '+(updated.get('location') or '地点待定'))\n    return {'patch': dumps(patch),'summary':receipt}\n\
          \ndef main(item_json, new_date, new_start, new_end, new_location, new_title):\n\
          \    return patch_event(item_json=item_json, new_date=new_date, new_start=new_start,\
          \ new_end=new_end, new_location=new_location, new_title=new_title)\n"
