    - id: journal_body
      type: custom
      data:
        title: 保存本轮原文与核心信息
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef model_json(raw):\n    text = re.sub(r'<think\\\
          b[^>]*>.*?</think>', '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'),\
          \ text.rfind('}')\n    value = obj(text[start:end + 1], {}) if start >=\
          \ 0 else {}\n    return value if isinstance(value, dict) else {}\n\ndef\
          \ journal_body(entry_id, user_id, text, canonical, state_json, polish_raw):\n\
          \    state=obj(state_json,{})\n    state={k:v for k,v in state.items() if\
          \ k not in ('memory_context','memory_control','pending_memory_sync')}\n\
          \    scope=obj(state.get('active_list'),{})\n    facts=obj(state.get('turn_facts'),{})\n\
          \    payload={'facts':facts,'result_excerpt':canonical[:4000]}\n    if scope.get('scope_id')==entry_id:payload['list_snapshot']=scope\n\
          \    if scope:\n        state['active_list']={k:v for k,v in scope.items()\
          \ if k!='items'}\n    suggestion=model_json(polish_raw)\n    summary=suggestion.get('memory_summary')\n\
          \    if not isinstance(summary,str) or not summary.strip():\n        summary=str(facts.get('intent')\
          \ or '对话')+'：'+re.sub(r'\\s+',' ',canonical)[:600]\n    topics=suggestion.get('topics')\
          \ or []\n    topics=[x[:80] for x in topics if isinstance(x,str) and x.strip()][:10]\
          \ if isinstance(topics,list) else []\n    return {'body':dumps({'p_user_id':user_id,'p_entry_id':entry_id,'p_assistant_text':text,\n\
          \                         'p_summary':summary[:1200],'p_topics':topics,'p_state':state,'p_payload':payload})}\n\
          \ndef main(entry_id, user_id, text, canonical, state_json, polish_raw):\n\
          \    return journal_body(entry_id=entry_id, user_id=user_id, text=text,\
          \ canonical=canonical, state_json=state_json, polish_raw=polish_raw)\n"
        variables:
        - variable: entry_id
          value_selector:
          - memory_load
          - entry_id
        - variable: user_id
          value_selector:
          - env
          - USER_ID
        - variable: text
          value_selector:
          - finish_turn
          - text
        - variable: canonical
