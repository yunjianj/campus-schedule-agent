      zIndex: 0
    - id: prepare_add
      type: custom
      data:
        title: 合并草稿与换算校历
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef model_json(raw):\n    text = re.sub(r'<think\\\
          b[^>]*>.*?</think>', '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'),\
          \ text.rfind('}')\n    value = obj(text[start:end + 1], {}) if start >=\
          \ 0 else {}\n    return value if isinstance(value, dict) else {}\n\ndef\
          \ hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\d{2})(?::00)?', str(value\
          \ or ''))\n    if not m or int(m[1]) > 23 or int(m[2]) > 59:\n        raise\
          \ ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n    return int(m[1]) * 60\
          \ + int(m[2])\n\ndef clock(value):\n    return '%02d:%02d' % divmod(value,\
          \ 60)\n\ndef iso(value):\n    return date.fromisoformat(str(value)).isoformat()\n\
          \ndef prepare_add(raw, draft, base_json):\n    base = obj(base_json)\n \
          \   data = model_json(raw)\n    items = data.get('items') or []\n    if\
          \ not isinstance(items, list):\n        items = []\n    old = obj(draft,\
          \ {})\n    old_items = old.get('items', []) if isinstance(old, dict) else\
          \ []\n    if not old_items and isinstance(old, dict) and old.get('title'):\n\
          \        old_items = [old]\n    # Multi-item drafts use stable draft_id;\
          \ an unqualified edit to several drafts is ambiguous.\n    if old_items:\n\
          \        if len(old_items) == 1 and len(items) <= 1:\n            delta\
          \ = items[0] if items else {}\n            items = [{**old_items[0], **{k:\
          \ v for k, v in delta.items() if v is not None}}]\n        else:\n     \
          \       by_id = {str(x.get('draft_id') if x.get('draft_id') is not None\
          \ else i): dict(x, draft_id=str(x.get('draft_id') if x.get('draft_id') is\
          \ not None else i)) for i, x in enumerate(old_items)}\n            for item\
          \ in items:\n                key = str(item.get('draft_id', ''))\n     \
          \           if key not in by_id:\n                    return {'ok': 'false',\
          \ 'error': '有多条草稿，请按 draft_id 指定要补充哪一条。', 'draft': dumps({'items': old_items}),\
          \ 'prepared': '{}', 'schedule_params': 'limit=0'}\n                by_id[key].update({k:\
          \ v for k, v in item.items() if v is not None})\n            items = list(by_id.values())\n\
          \    errors, normalized, days = [], [], []\n    for index, item in enumerate(items):\n\
          \        r = dict(item, draft_id=str(item.get('draft_id') if item.get('draft_id')\
          \ is not None else index))\n        if r.get('week') is not None:\n    \
          \        semester = base['profile'].get('semester_start')\n            if\
          \ not semester:\n                errors.append('请先设置学期第一周周一的日期。')\n    \
          \        else:\n                week, weekday = int(r['week']), int(r.get('weekday')\
          \ or 0)\n                if not 1 <= week <= 60 or not 1 <= weekday <= 7:\n\
          \                    errors.append('请明确学期周数和星期几。')\n                else:\n\
          \                    r['date'] = (date.fromisoformat(semester) + timedelta(weeks=week-1,\
          \ days=weekday-1)).isoformat()\n        if r.get('lesson_start') is not\
          \ None:\n            lessons = base['profile'].get('lessons', {})\n    \
          \        first = lessons.get(str(r['lesson_start']))\n            last =\
          \ lessons.get(str(r.get('lesson_end') or r['lesson_start']))\n         \
          \   if not first or not last:\n                errors.append('请先设置所涉及的课程节次起止时间。')\n\
          \            else:\n                r['start_time'], r['end_time'] = first[0],\
          \ last[1]\n        if not str(r.get('title') or '').strip():\n         \
          \   errors.append('请补充第 %d 条的标题。' % (index + 1))\n        if r.get('ambiguous'):\n\
          \            errors.append(str(r['ambiguous']))\n        if r.get('kind')\
          \ == 'event' and not r.get('start_time'):\n            errors.append('请补充「%s」的开始时间。'\
          \ % r.get('title', '活动'))\n        if r.get('start_time') and not r.get('date'):\n\
          \            errors.append('请补充「%s」的日期。' % r.get('title', '活动'))\n     \
          \   try:\n            if r.get('date'):\n                r['date'] = iso(r['date'])\n\
          \                days.append(r['date'])\n            if r.get('start_time'):\n\
          \                start = hm(r['start_time'])\n                if not r.get('end_time'):\n\
          \                    if start + 60 >= 1440:\n                        raise\
          \ ValueError('默认一小时会跨日，请明确结束时间。')\n                    r['end_time'] = clock(start\
          \ + 60)\n                    r['estimated_end'] = True\n               \
          \ if hm(r['end_time']) <= start:\n                    raise ValueError('结束时间必须晚于开始时间。')\n\
          \        except (ValueError, TypeError) as exc:\n            errors.append(str(exc))\n\
          \        normalized.append(r)\n    if not items:\n        errors.append('没识别到安排，请补充标题、日期或图片内容。')\n\
          \    return {'ok': 'false' if errors else 'true', 'error': '\\n'.join(dict.fromkeys(errors)),\n\
          \            'prepared': dumps({'items': normalized}), 'draft': dumps({'items':\
          \ normalized}),\n            'schedule_params': ('event_date=in.(' + ','.join(sorted(set(days)))\
          \ + ')&' if days else '') + 'order=event_date.asc,start_time.asc&limit=1000'}\n\
          \ndef main(raw, draft, base_json):\n    return prepare_add(raw=raw, draft=draft,\
          \ base_json=base_json)\n"
        variables:
        - variable: raw
          value_selector:
          - extract
          - text
        - variable: draft
          value_selector:
          - conversation
          - draft
        - variable: base_json
          value_selector:
          - now
          - base_context
        outputs:
          ok:
            type: string
            children: null
          error:
            type: string
            children: null
          draft:
            type: string
            children: null
          prepared:
            type: string
            children: null
          schedule_params:
            type: string
            children: null
      position:
        x: 680
        y: 1260
      positionAbsolute:
        x: 680
        y: 1260
      width: 260
      height: 100
      selected: false
      zIndex: 0
