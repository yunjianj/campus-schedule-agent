    - id: upd_find
      type: custom
      data:
        title: 定位待修改记录
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\nUPDATE_FIELDS\
          \ = ('new_date','new_start','new_end','new_location','new_title')\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef rows(body, status=200, allow_limit=False):\n\
          \    value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef clock(value):\n    return '%02d:%02d'\
          \ % divmod(value, 60)\n\ndef context_items(records):\n    \"\"\"The displayed\
          \ result, not an LLM's prose, defines subsequent referents.\"\"\"\n    fields\
          \ = ('id', 'title', 'event_date', 'start_time', 'end_time', 'location',\
          \ 'category')\n    return [{k: r.get(k) for k in fields} for r in records\
          \ if r.get('id')]\n\ndef chinese_number(value):\n    if value.isdigit():\n\
          \        return int(value)\n    digits = dict(zip('零一二三四五六七八九', range(10)))\n\
          \    digits['两'] = 2\n    if '十' in value:\n        a, _, b = value.partition('十')\n\
          \        return (digits.get(a, 1) if a else 1) * 10 + (digits.get(b, 0)\
          \ if b else 0)\n    return digits.get(value, -1)\n\ndef date_span(text,\
          \ base):\n    \"\"\"Resolve common explicit selectors without borrowing\
          \ dates from model memory.\"\"\"\n    today = date.fromisoformat(base['today'])\n\
          \    m = re.search(r'(20\\d{2})[-年/](\\d{1,2})[-月/](\\d{1,2})日?', text)\n\
          \    if m:\n        day = date(int(m[1]), int(m[2]), int(m[3]))\n      \
          \  return day.isoformat(), day.isoformat()\n    m = re.search(r'(?<!\\d)(\\\
          d{1,2})月(\\d{1,2})[日号]?', text)\n    if m:\n        day = date(today.year,\
          \ int(m[1]), int(m[2]))\n        return day.isoformat(), day.isoformat()\n\
          \    m = re.search(r'(下下|下|这|本)?(?:周|星期|礼拜)([一二三四五六日天])', text)\n    if\
          \ m:\n        prefix = m[1] or ''\n        idx = '一二三四五六日'.find('日' if m[2]\
          \ == '天' else m[2])\n        day = today - timedelta(days=today.weekday())\
          \ + timedelta(days=idx, weeks={'下下':2, '下':1}.get(prefix,0))\n        if\
          \ not prefix and day < today:\n            day += timedelta(days=7)\n  \
          \      return day.isoformat(), day.isoformat()\n    for label, offset in\
          \ [('大后天',3),('后天',2),('明天',1),('今天',0),('昨天',-1)]:\n        if label in\
          \ text:\n            day = today + timedelta(days=offset)\n            return\
          \ day.isoformat(), day.isoformat()\n    m = re.search(r'(上|下|这|本)周', text)\n\
          \    if m:\n        begin = today - timedelta(days=today.weekday()) + timedelta(weeks={'上':-1,'下':1}.get(m[1],0))\n\
          \        return begin.isoformat(), (begin+timedelta(days=6)).isoformat()\n\
          \    m = re.search(r'(上个|下个|这个|本)月', text)\n    if m:\n        month = today.year*12+today.month-1\
          \ + {'上个':-1,'下个':1}.get(m[1],0)\n        year, index = divmod(month,12)\n\
          \        begin = date(year,index+1,1)\n        ny, nm = divmod(month+1,12)\n\
          \        return begin.isoformat(), (date(ny,nm+1,1)-timedelta(days=1)).isoformat()\n\
          \    return '', ''\n\nTIME_PATTERN = r'(凌晨|上午|早上|中午|下午|晚上|傍晚)?\\s*([零一二两三四五六七八九十\\\
          d]{1,3})(?:[:：](\\d{2})|(?:点|时)(半|[零一二两三四五六七八九十\\d]{1,3}分?)?)'\n\nEDIT_PATTERN\
          \ = r'改成|改到|改为|改在|修改|更改|改一下|调整到|调整为|挪到|移到|换成|换到|搬到|推迟|提前|延后|往后.{0,3}挪|往前.{0,3}挪'\n\
          \ndef spoken_time(match, item=None):\n    period, hour, minute, tail = match.groups()\n\
          \    h = chinese_number(hour)\n    minute = int(minute) if minute is not\
          \ None else (30 if tail == '半' else chinese_number(tail.rstrip('分')) if\
          \ tail else 0)\n    if period in ('下午','晚上','傍晚') and h < 12:\n        h\
          \ += 12\n    elif period == '中午' and h < 11:\n        h += 12\n    elif\
          \ not period and ':' not in match[0] and '：' not in match[0] and 1 <= h\
          \ <= 12:\n        if not item or not item.get('start_time'):\n         \
          \   return ''\n        original = hm(item['start_time'])\n        if original\
          \ >= 12*60 and h < 12:\n            h += 12\n        elif original < 12*60\
          \ and h == 12:\n            return ''\n    value = '%02d:%02d' % (h, minute)\n\
          \    hm(value)\n    return value\n\ndef edit_patch(text, item, base):\n\
          \    \"\"\"Explicit clock edits and relative moves; no subject or ID is\
          \ model-generated.\"\"\"\n    # Text attributes are literal values: a room\
          \ such as “四点会议室” is not a clock edit.\n    result, time_clauses = {}, []\n\
          \    clauses = re.split(r'[，,;；](?=(?:并|再|同时)?(?:时间|开始时间|结束时间|日期|地点|位置|地址|标题|名称|名字))',\
          \ text)\n    for clause in clauses:\n        field = re.search(r'(地点|位置|地址|标题|名称|名字)(?:\\\
          s*(?:修改|更改|改|调整|换)(?:成|为|到|在|一下)?\\s*)[：:]*\\s*(.*)', clause)\n        if\
          \ field:\n            key = 'new_location' if field[1] in ('地点','位置','地址')\
          \ else 'new_title'\n            value = re.sub(r'(?:谢谢|就好|就行|即可|吧)$', '',\
          \ field[2]).strip().strip('“”\"\\'')\n            result[key] = value\n\
          \        else:\n            time_clauses.append(clause)\n    if result and\
          \ not time_clauses:\n        return result\n    text = '，'.join(time_clauses)\n\
          \    change = re.search(EDIT_PATTERN, text)\n    tail = text[change.end():]\
          \ if change else text\n    # For '推迟到四点' the '到' is harmless to the time/date\
          \ parsers.\n    start, end = date_span(tail,base)\n    if start and start\
          \ == end:\n        result['new_date'] = start\n    relative = re.search(r'(往后|往前|推迟|提前|延后|晚|早).*?(半|[一二两三四五六七八九十\\\
          d]+)(个?小时|分钟)',text)\n    if relative and item:\n        amount = 30 if\
          \ relative[2] == '半' else chinese_number(relative[2]) * (60 if '小时' in relative[3]\
          \ else 1)\n        sign = -1 if relative[1] in ('往前','提前','早') else 1\n\
          \        total = hm(item['start_time']) + sign*amount\n        if not 0\
          \ <= total < 1440:\n            raise ValueError('调整后会跨日，请明确新的日期和时间。')\n\
          \        result['new_start'] = clock(total)\n        return result\n   \
          \ times = list(re.finditer(TIME_PATTERN,tail))\n    if times:\n        value\
          \ = spoken_time(times[0], item)\n        # An unresolved bare clock must\
          \ not fall back to a guessed model value.\n        field = 'new_end' if\
          \ '结束' in text and '开始' not in text and len(times)==1 else 'new_start'\n\
          \        result[field] = value\n        if len(times)>1:\n            result['new_end']\
          \ = spoken_time(times[1],item)\n    return result\n\ndef locate_event(body,\
          \ target, start_date, end_date, reference_id, pending_json='', base_json=''):\n\
          \    records = rows(body)\n    ids = set(reference_id.split(',')) if reference_id\
          \ else set()\n    matches = [r for r in records if (not ids or r.get('id')\
          \ in ids)\n               and (not target or target in r['title'])\n   \
          \            and (not start_date or start_date <= r['event_date'] <= (end_date\
          \ or start_date))]\n    pending = obj(pending_json, {})\n    pending['candidates']\
          \ = context_items(matches)\n    patch = dict(pending.get('patch', {}))\n\
          \    if len(matches)==1 and base_json:\n        patch.update(edit_patch(pending.get('instruction',''),matches[0],obj(base_json)))\n\
          \    pending['patch']=patch\n    has_patch = any(patch.get(k) for k in UPDATE_FIELDS)\n\
          \    unique = len(matches)==1 and has_patch\n    lines = ['%d. %s %s %s–%s'\
          \ % (i+1,r['event_date'],r['title'],str(r['start_time'])[:5],str(r['end_time'])[:5])\
          \ for i,r in enumerate(matches[:20])]\n    if len(matches)==1 and not has_patch:\n\
          \        instruction=pending.get('instruction','')\n        question='想把地点改到哪里？'\
          \ if re.search(r'地点|位置|地址',instruction) else '想把标题改成什么？' if re.search(r'标题|名称|名字',instruction)\
          \ else '请补充新的日期、开始时间（上午还是下午）、地点或标题。'\n        text = '已选中日程，'+question+'\\\
          n\\n'+'\\n'.join(lines)\n    else:\n        text = ('找到：\\n' if unique else\
          \ '请先选定一条日程，原修改要求已保留，可回复“第一条”或标题：\\n')+('\\n'.join(lines) or '没有匹配记录，请提供标题和日期。')\n\
          \    return {'found':'true' if unique else 'false', 'id':matches[0]['id']\
          \ if unique else '',\n            'item_json':dumps(matches[0]) if unique\
          \ else '{}', 'references':dumps(context_items(matches)),\n            'pending_update':dumps(pending),\
          \ 'text':text,\n            **{k:str(patch.get(k) or '') for k in UPDATE_FIELDS}}\n\
          \ndef main(body, target, start_date, end_date, reference_id, pending_json,\
          \ base_json):\n    return locate_event(body=body, target=target, start_date=start_date,\
          \ end_date=end_date, reference_id=reference_id, pending_json=pending_json,\
          \ base_json=base_json)\n"
        variables:
