          \    if normalized in DELETE_CONFIRMATIONS:return 'delete'\n    if normalized\
          \ in GENERIC_CONFIRMATIONS:return 'generic'\n    return ''\n\ndef is_delete_confirmation(text):\n\
          \    kind=confirmation_kind(text)\n    normalized=re.sub(r'[\\s，,。.!！?？～~✅\U0001F44D\
