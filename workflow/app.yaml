    - id: now
      type: custom
      data:
        title: 组装基础上下文
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\nDEFAULT_PROFILE\
          \ = {\n    'timezone': 'Asia/Shanghai', 'semester_start': None, 'lessons':\
          \ {},\n    'allowed_windows': [['08:00', '22:00']], 'blocked_windows': [],\n\
          \    'study_blocked_windows': [], 'max_blocks_per_day': 2, 'reply_style':\
          \ '简洁、自然的中文',\n}\n\nPROFILE_KEYS = set(DEFAULT_PROFILE)\n\ndef dumps(value):\n\
          \    return json.dumps(value, ensure_ascii=False, separators=(',', ':'))\n\
          \ndef obj(value, default=None):\n    if not isinstance(value, str):\n  \
          \      return value if value is not None else default\n    try:\n      \
          \  return json.loads(value)\n    except (ValueError, TypeError):\n     \
          \   return default\n\ndef rows(body, status=200, allow_limit=False):\n \
          \   value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef windows(value):\n    if not\
          \ isinstance(value, list):\n        raise ValueError('时段须为二维数组。')\n    result\
          \ = []\n    for pair in value:\n        if not isinstance(pair, list) or\
          \ len(pair) != 2 or hm(pair[0]) >= hm(pair[1]):\n            raise ValueError('时段起止无效。')\n\
          \        result.append([str(pair[0]), str(pair[1])])\n    return result\n\
          \ndef profile_checked(raw):\n    if not isinstance(raw, dict) or set(raw)\
          \ - PROFILE_KEYS:\n        raise ValueError('画像字段不受支持。')\n    if len(dumps(raw))\
          \ > 12000:\n        raise ValueError('画像过长，请减少节次或限制条目。')\n    p = dict(DEFAULT_PROFILE)\n\
          \    p.update(raw)\n    ZoneInfo(p['timezone'])\n    if p['semester_start']:\n\
          \        d = date.fromisoformat(p['semester_start'])\n        if d.weekday()\
          \ != 0:\n            raise ValueError('学期第一周起始日必须为周一。')\n    if not isinstance(p['lessons'],\
          \ dict):\n        raise ValueError('节次表须为对象。')\n    for key, pair in p['lessons'].items():\n\
          \        if not str(key).isdigit() or int(key) < 1:\n            raise ValueError('节次编号无效。')\n\
          \        windows([pair])\n    p['allowed_windows'] = windows(p['allowed_windows'])\n\
          \    p['blocked_windows'] = windows(p['blocked_windows'])\n    p['study_blocked_windows']\
          \ = windows(p['study_blocked_windows'])\n    if not p['allowed_windows']:\n\
          \        raise ValueError('至少需要一个可安排时段。')\n    if type(p['max_blocks_per_day'])\
          \ is not int or not 1 <= p['max_blocks_per_day'] <= 20:\n        raise ValueError('每天块数须在\
          \ 1–20 之间。')\n    if not isinstance(p['reply_style'], str) or len(p['reply_style'])\
          \ > 200:\n        raise ValueError('回复偏好须为不超过 200 字的文本。')\n    return p\n\
          \ndef base_context(body, now_iso=''):\n    data = rows(body)\n    if len(data)\
          \ > 1:\n        raise ValueError('画像记录不唯一。')\n    profile = profile_checked(data[0].get('profile')\
          \ or {}) if data else dict(DEFAULT_PROFILE)\n    now = datetime.fromisoformat(now_iso)\
          \ if now_iso else datetime.now(ZoneInfo(profile['timezone']))\n    now =\
          \ now.astimezone(ZoneInfo(profile['timezone']))\n    context = {'now': now.isoformat(),\
          \ 'today': now.date().isoformat(),\n               'weekday': now.isoweekday(),\
          \ 'profile': profile}\n    return {'now': context['now'], 'today': context['today'],\n\
          \            'weekday': '周' + '一二三四五六日'[now.weekday()],\n            'base_context':\
          \ dumps(context)}\n\ndef main(body):\n    return base_context(body=body)\n"
        variables:
        - variable: body
          value_selector:
          - get_profile
          - body
        outputs:
          now:
            type: string
            children: null
          today:
            type: string
            children: null
          weekday:
            type: string
            children: null
          base_context:
            type: string
            children: null
      position:
        x: 680
        y: 0
      positionAbsolute:
        x: 680
        y: 0
      width: 260
      height: 100
      selected: false
      zIndex: 0
    - id: state_input
      type: custom
      data:
        title: 读取会话状态
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef model_data(value):\n    \"\"\"Remove service\
          \ identity/configuration fields from model-facing state.\"\"\"\n    if isinstance(value,\
          \ str) and value[:1] in ('{','['):\n        parsed = obj(value)\n      \
          \  if isinstance(parsed,(dict,list)):\n            return model_data(parsed)\n\
          \    if isinstance(value, dict):\n        return {k:model_data(v) for k,v\
          \ in value.items() if k.lower() not in\n                ('user_id','conversation_id','apikey','supabase_key','authorization','access_token','refresh_token','pending_memory_sync')}\n\
          \    if isinstance(value, list):\n        return [model_data(v) for v in\
          \ value]\n    return value\n\ndef capture_state(**state):\n    return {'state_json':\
          \ dumps(state), 'model_state': dumps(model_data({k:(scope_model(v) if k=='active_list'\
          \ else v) for k,v in state.items() if k not in ('recent_dialogue','memory_context','pending_memory_sync')}))}\n\
          \ndef scope_model(value):\n    scope=obj(value,{})\n    return {'scope_id':scope.get('scope_id'),\
          \ 'label':scope.get('label'), 'count':len(scope.get('items',[])), 'items':scope.get('items',[])[:20]}\n\
          \ndef main(draft, pending_event, review_range, pending_delete, conflict_note,\
          \ review_stage, plan_stage, pending_plan, delete_stage, delete_candidates,\
          \ pending_delete_filter, active_operation, last_referenced_items, review_feedback,\
          \ recent_dialogue, pending_update, active_list, memory_context, memory_control,\
          \ pending_memory_sync, turn_facts, memory_choices, focus_entry_id):\n  \
          \  return capture_state(draft=draft, pending_event=pending_event, review_range=review_range,\
          \ pending_delete=pending_delete, conflict_note=conflict_note, review_stage=review_stage,\
          \ plan_stage=plan_stage, pending_plan=pending_plan, delete_stage=delete_stage,\
          \ delete_candidates=delete_candidates, pending_delete_filter=pending_delete_filter,\
          \ active_operation=active_operation, last_referenced_items=last_referenced_items,\
          \ review_feedback=review_feedback, recent_dialogue=recent_dialogue, pending_update=pending_update,\
          \ active_list=active_list, memory_context=memory_context, memory_control=memory_control,\
          \ pending_memory_sync=pending_memory_sync, turn_facts=turn_facts, memory_choices=memory_choices,\
          \ focus_entry_id=focus_entry_id)\n"
        variables:
        - variable: draft
          value_selector:
          - conversation
          - draft
        - variable: pending_event
          value_selector:
