          \    m = re.search(r'(下下|下|这|本)?(?:周|星期|礼拜)([一二三四五六日天])', text)\n    if\
          \ m:\n        prefix = m[1] or ''\n        idx = '一二三四五六日'.find('日' if m[2]\
          \ == '天' else m[2])\n        day = today - timedelta(days=today.weekday())\
          \ + timedelta(days=idx, weeks={'下下':2, '下':1}.get(prefix,0))\n        if\
