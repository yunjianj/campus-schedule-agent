    - id: check_plan
      type: custom
      data:
        title: 确认前重新检查
        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef rows(body, status=200, allow_limit=False):\n\
          \    value = obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\\
          d{2})(?::00)?', str(value or ''))\n    if not m or int(m[1]) > 23 or int(m[2])\
          \ > 59:\n        raise ValueError('时间格式须为 HH:MM，且在 00:00–23:59 内。')\n  \
          \  return int(m[1]) * 60 + int(m[2])\n\ndef check_plan(plan_json, body,\
          \ base_json, user_id):\n    plan, existing = obj(plan_json, {}), rows(body)\n\
          \    now = datetime.fromisoformat(obj(base_json)['now'])\n    blocks, tasks\
          \ = plan.get('blocks', []), plan.get('tasks', [])\n    reasons = []\n  \
          \  for b in blocks:\n        if b.get('user_id') != user_id:\n         \
          \   reasons.append('用户不一致')\n        when = datetime.fromisoformat(b['event_date']\
          \ + 'T' + b['start_time']).replace(tzinfo=now.tzinfo)\n        if when <\
          \ now:\n            reasons.append('部分时间块已过期')\n        if any(x['event_date']\
          \ == b['event_date'] and hm(b['start_time']) < hm(x['end_time']) and hm(x['start_time'])\
          \ < hm(b['end_time']) for x in existing):\n            reasons.append('出现新的时间冲突')\n\
          \        existing.append(b)\n    if not blocks and not tasks:\n        reasons.append('没有待确认规划')\n\
          \    if any(t.get('user_id') != user_id for t in tasks):\n        reasons.append('用户不一致')\n\
          \    return {'ok': 'false' if reasons else 'true', 'error': '；'.join(dict.fromkeys(reasons))\
          \ + ('，请重新规划并确认。' if reasons else ''),\n            'sched_body': dumps(blocks),\
          \ 'task_body': dumps(tasks), 'count': len(blocks)}\n\ndef main(plan_json,\
          \ body, base_json, user_id):\n    return check_plan(plan_json=plan_json,\
          \ body=body, base_json=base_json, user_id=user_id)\n"
        variables:
        - variable: plan_json
          value_selector:
