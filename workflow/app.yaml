        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ obj(value, default=None):\n    if not isinstance(value, str):\n      \
          \  return value if value is not None else default\n    try:\n        return\
          \ json.loads(value)\n    except (ValueError, TypeError):\n        return\
          \ default\n\ndef rows(body, status=200, allow_limit=False):\n    value =\
          \ obj(body)\n    if not 200 <= int(status) < 300 or not isinstance(value,\
          \ list):\n        raise ValueError('读取失败，请稍后重试；未将失败视为空记录。')\n    if len(value)\
          \ >= 1000 and not allow_limit:\n        raise ValueError('记录达到读取上限，请缩小日期范围后重试。')\n\
          \    return value\n\ndef read_guard(body, status):\n    try:\n        rows(body,\
          \ status)\n        return {'ok': 'true', 'error': ''}\n    except (ValueError,\
          \ TypeError) as exc:\n        return {'ok': 'false', 'error': str(exc)}\n\
          \ndef main(body, status):\n    return read_guard(body=body, status=status)\n"
