        type: code
        selected: false
        code_language: python3
        code: "import json\n\nimport re\n\nfrom datetime import date, datetime, timedelta\n\
          \nfrom zoneinfo import ZoneInfo\n\nfrom urllib.parse import quote\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value, str):\n\
          \        return value if value is not None else default\n    try:\n    \
          \    return json.loads(value)\n    except (ValueError, TypeError):\n   \
          \     return default\n\ndef model_json(raw):\n    text = re.sub(r'<think\\\
          b[^>]*>.*?</think>', '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'),\
          \ text.rfind('}')\n    value = obj(text[start:end + 1], {}) if start >=\
          \ 0 else {}\n    return value if isinstance(value, dict) else {}\n\ndef\
          \ chinese_number(value):\n    if value.isdigit():\n        return int(value)\n\
          \    digits = dict(zip('零一二三四五六七八九', range(10)))\n    digits['两'] = 2\n\
          \    if '十' in value:\n        a, _, b = value.partition('十')\n        return\
          \ (digits.get(a, 1) if a else 1) * 10 + (digits.get(b, 0) if b else 0)\n\
          \    return digits.get(value, -1)\n\ndef date_span(text, base):\n    \"\"\
          \"Resolve common explicit selectors without borrowing dates from model memory.\"\
          \"\"\n    today = date.fromisoformat(base['today'])\n    m = re.search(r'(20\\\
          d{2})[-年/](\\d{1,2})[-月/](\\d{1,2})日?', text)\n    if m:\n        day =\
          \ date(int(m[1]), int(m[2]), int(m[3]))\n        return day.isoformat(),\
          \ day.isoformat()\n    m = re.search(r'(?<!\\d)(\\d{1,2})月(\\d{1,2})[日号]?',\
          \ text)\n    if m:\n        day = date(today.year, int(m[1]), int(m[2]))\n\
          \        return day.isoformat(), day.isoformat()\n    m = re.search(r'(下下|下|这|本)?(?:周|星期|礼拜)([一二三四五六日天])',\
          \ text)\n    if m:\n        prefix = m[1] or ''\n        idx = '一二三四五六日'.find('日'\
          \ if m[2] == '天' else m[2])\n        day = today - timedelta(days=today.weekday())\
          \ + timedelta(days=idx, weeks={'下下':2, '下':1}.get(prefix,0))\n        if\
          \ not prefix and day < today:\n            day += timedelta(days=7)\n  \
          \      return day.isoformat(), day.isoformat()\n    for label, offset in\
          \ [('大后天',3),('后天',2),('明天',1),('今天',0),('昨天',-1)]:\n        if label in\
          \ text:\n            day = today + timedelta(days=offset)\n            return\
          \ day.isoformat(), day.isoformat()\n    m = re.search(r'(上|下|这|本)周', text)\n\
          \    if m:\n        begin = today - timedelta(days=today.weekday()) + timedelta(weeks={'上':-1,'下':1}.get(m[1],0))\n\
          \        return begin.isoformat(), (begin+timedelta(days=6)).isoformat()\n\
          \    m = re.search(r'(上个|下个|这个|本)月', text)\n    if m:\n        month = today.year*12+today.month-1\
          \ + {'上个':-1,'下个':1}.get(m[1],0)\n        year, index = divmod(month,12)\n\
          \        begin = date(year,index+1,1)\n        ny, nm = divmod(month+1,12)\n\
          \        return begin.isoformat(), (date(ny,nm+1,1)-timedelta(days=1)).isoformat()\n\
          \    return '', ''\n\ndef recall_request(raw, query, base_json, state_json,\
          \ entry_id, user_id, conversation_id, index_json):\n    import uuid\n  \
          \  data=model_json(raw)\n    base=obj(base_json)\n    state=obj(state_json,{})\n\
          \    index=obj(index_json,[])\n    allowed={r['id'] for r in index}\n  \
          \  selected=[x for x in data.get('entry_ids',[]) if isinstance(x,str) and\
          \ x in allowed][:8] if isinstance(data.get('entry_ids',[]),list) else []\n\
          \    topics=[str(t)[:80] for t in data.get('topics',[]) if isinstance(t,str)\
          \ and t.strip()][:10] if isinstance(data.get('topics',[]),list) else []\n\
          \    historical=bool(re.search(r'昨天.*(?:对话|聊|列表|表)|上次|以前|之前.*(?:列表|表|对话)|历史|上下文|原文|记录文档|刚才那张表',query))\n\
          \    if re.search(r'忽略之前|忽略以前|不用之前的上下文',query):historical=False\n    view=bool(re.search(r'(?:查看|看看|显示|读).*(?:上下文|对话|原文|记忆|文档)',query))\n\
          \    explicit_date=historical and bool(re.search(r'今天|昨天|前天|上周|本周|这周|上个月|下个月|\\\
          d{1,2}月|20\\d{2}-',query))\n    choices=obj(state.get('memory_choices'),{})\n\
          \    scope_choice=re.search(r'第([一二两三四五六七八九十\\d]+)张',query)\n    selected_scope=None\n\
          \    if scope_choice and choices.get('scopes'):\n        number=chinese_number(scope_choice[1])-1\n\
          \        if 0<=number<len(choices['scopes']):\n            selected_scope=choices['scopes'][number]['scope_id']\n\
          \            historical=True;explicit_date=False;selected=[selected_scope]\n\
          \    start=end=None\n    if explicit_date:\n        a,b=date_span(query,base)\n\
          \        if not a and '前天' in query:a=b=(date.fromisoformat(base['today'])-timedelta(days=2)).isoformat()\n\
          \        if a:\n            tz=ZoneInfo(base['profile']['timezone'])\n \
          \           start=datetime.combine(date.fromisoformat(a),datetime.min.time(),tzinfo=tz).isoformat()\n\
          \            end=datetime.combine(date.fromisoformat(b)+timedelta(days=1),datetime.min.time(),tzinfo=tz).isoformat()\n\
          \            selected=[]\n    scope=obj(state.get('active_list'),{})\n \
          \   scope_id=None\n    if not historical and re.search(r'第.+[条个场项]|这条|那条|它|刚才',query):\n\
          \        scope_id=scope.get('scope_id')\n    proposed=data.get('scope_id')\n\
          \    if historical and isinstance(proposed,str) and proposed in allowed\
          \ and not explicit_date:scope_id=proposed\n    if scope_id:\n        try:scope_id=str(uuid.UUID(scope_id))\n\
          \        except ValueError:scope_id=None\n    control={'historical':historical,'view':view,'view_raw':'原文'\
          \ in query,\n        'ignore_only':bool(re.fullmatch(r'(?:请)?(?:忽略之前|忽略以前|不用之前的上下文)[的上下文。！!\\\
          s]*',query))}\n    if selected_scope:\n        scope_id=str(uuid.UUID(selected_scope))\n\
          \        if re.fullmatch(r'第[一二两三四五六七八九十\\d]+张[。！!\\s]*',query):control['replay_query']=choices.get('instruction',query)\n\
          \        control['scope_adopted']=True\n    if scope_id in allowed and scope_id\
          \ not in selected:selected=(selected+[scope_id])[:8]\n    return {'body':dumps({'p_user_id':user_id,'p_conversation_id':conversation_id,'p_entry_id':entry_id,\n\
          \         'p_entry_ids':selected,'p_date_start':start,'p_date_end':end,'p_topics':topics,\n\
          \         'p_explicit_history':historical,'p_scope_id':scope_id,'p_view_raw':control['view_raw']}),\
          \ 'control':dumps(control)}\n\ndef main(raw, query, base_json, state_json,\
          \ entry_id, user_id, conversation_id, index_json):\n    return recall_request(raw=raw,\
          \ query=query, base_json=base_json, state_json=state_json, entry_id=entry_id,\
          \ user_id=user_id, conversation_id=conversation_id, index_json=index_json)\n"
