          \    'study_blocked_windows': [], 'max_blocks_per_day': 2, 'reply_style':\
          \ '简洁、自然的中文',\n}\n\nPROFILE_KEYS = set(DEFAULT_PROFILE)\n\nUPDATE_FIELDS\
          \ = ('new_date','new_start','new_end','new_location','new_title')\n\nSTATE_KEYS\
          \ = ['draft', 'pending_event', 'review_range', 'pending_delete',\n     \
          \         'conflict_note', 'review_stage', 'plan_stage', 'pending_plan',\n\
          \              'delete_stage', 'delete_candidates', 'pending_delete_filter',\n\
          \              'active_operation', 'last_referenced_items', 'review_feedback',\
          \ 'recent_dialogue', 'pending_update', 'active_list', 'memory_context',\
          \ 'memory_control', 'pending_memory_sync', 'turn_facts', 'memory_choices',\
          \ 'focus_entry_id']\n\ndef dumps(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ separators=(',', ':'))\n\ndef obj(value, default=None):\n    if not isinstance(value,\
          \ str):\n        return value if value is not None else default\n    try:\n\
          \        return json.loads(value)\n    except (ValueError, TypeError):\n\
          \        return default\n\ndef model_data(value):\n    \"\"\"Remove service\
          \ identity/configuration fields from model-facing state.\"\"\"\n    if isinstance(value,\
          \ str) and value[:1] in ('{','['):\n        parsed = obj(value)\n      \
          \  if isinstance(parsed,(dict,list)):\n            return model_data(parsed)\n\
          \    if isinstance(value, dict):\n        return {k:model_data(v) for k,v\
          \ in value.items() if k.lower() not in\n                ('user_id','conversation_id','apikey','supabase_key','authorization','access_token','refresh_token','pending_memory_sync')}\n\
          \    if isinstance(value, list):\n        return [model_data(v) for v in\
          \ value]\n    return value\n\ndef model_json(raw):\n    text = re.sub(r'<think\\\
          b[^>]*>.*?</think>', '', str(raw or ''), flags=re.S)\n    start, end = text.find('{'),\
          \ text.rfind('}')\n    value = obj(text[start:end + 1], {}) if start >=\
          \ 0 else {}\n    return value if isinstance(value, dict) else {}\n\ndef\
          \ hm(value):\n    m = re.fullmatch(r'(\\d{2}):(\\d{2})(?::00)?', str(value\
